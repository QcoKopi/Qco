<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QSystem — Integrated Business Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F2EA;a
    --surface:#FFFFFF;
    --surface-alt:#F0E6D6;
    --ink:#2B1D14;
    --ink-soft:#78685A;
    --ink-faint:#A79683;
    --accent:#B4732E;
    --accent-dark:#8A5620;
    --accent-soft:#F1DEC0;
    --sm:#B4732E;
    --sm-soft:#F1DEC0;
    --po:#5F7A4F;
    --po-soft:#DEE7D4;
    --success:#5F7A4F;
    --success-soft:#DEE7D4;
    --warning:#C07A17;
    --warning-soft:#F5E1BE;
    --danger:#A23E2A;
    --danger-soft:#F1DBD3;
    --line:#E6DACB;
    --shadow: 0 1px 2px rgba(43,29,20,.06), 0 6px 20px -8px rgba(43,29,20,.18);
    --radius:14px;
    --radius-sm:10px;
    --topbar-h:64px;
    --nav-h:68px;
    --font-display:'Fraunces', Georgia, serif;
    --font-body:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono:'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
    --sidebar-w:260px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:linear-gradient(180deg,#EFE6D6 0%,var(--bg) 220px);
    color:var(--ink);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  #app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;display:flex;flex-direction:column;}
  @media (min-width:560px){
    body{padding:24px 0;}
    #app{min-height:calc(100vh - 48px); border-radius:28px; box-shadow:0 20px 60px -20px rgba(43,29,20,.35); overflow:hidden;}
  }
  @media (min-width:900px){
    body{padding:0; background:var(--bg);}
    #app{max-width:100%; min-height:100vh; border-radius:0; box-shadow:none; flex-direction:row;}
    .sidebar{order:0; position:fixed; left:0; top:0; bottom:0; width:var(--sidebar-w); z-index:30; border-right:1px solid var(--line);}
    .main-area{order:1; margin-left:var(--sidebar-w); flex:1; min-height:100vh; display:flex; flex-direction:column;}
    .topbar{position:sticky; top:0;}
    .content{padding:24px 32px 48px !important; max-width:1040px;}
    .login-wrap{max-width:460px; margin:0 auto; width:100%;}
    .table-wrap{min-width:0;}
    .task-table{min-width:0; width:100%;}
    .team-summary{max-width:640px;}
    .app-grid{grid-template-columns:repeat(2,1fr) !important;}
    .mockup-grid{grid-template-columns:repeat(3,1fr) !important;}
  }
  a{color:inherit;}
  button{font-family:inherit;}
  h1,h2,h3{font-family:var(--font-display); margin:0; letter-spacing:-0.01em;}
  p{margin:0;}
  .hidden{display:none !important;}
  .muted{color:var(--ink-soft);}
  .faint{color:var(--ink-faint);}
  .mono{font-family:var(--font-mono);}
  .row{display:flex; align-items:center;}
  .between{justify-content:space-between;}
  .gap-8{gap:8px;} .gap-6{gap:6px;} .gap-12{gap:12px;} .gap-16{gap:16px;}
  .wrap{flex-wrap:wrap;}
  :focus-visible{outline:2px solid var(--accent-dark); outline-offset:2px; border-radius:6px;}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important; transition-duration:.001ms !important;}}

  /* ---------- Sidebar (desktop) ---------- */
  .sidebar{
    background:var(--surface);
    display:none; flex-direction:column; padding:20px 16px;
  }
  @media (min-width:900px){
    .sidebar{display:flex !important;}
    .bottomnav{display:none !important;}
  }
  .sidebar-brand{display:flex; align-items:center; gap:10px; margin-bottom:28px; padding:0 8px;}
  .sidebar-brand .brand-mark{width:36px; height:36px; border-radius:10px; background:var(--accent); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:18px; color:#231508;}
  .sidebar-brand .brand-name{font-family:var(--font-display); font-weight:700; font-size:20px;}
  .sidebar-brand .brand-sub{font-size:10px; color:var(--ink-faint); letter-spacing:.04em; text-transform:uppercase; margin-top:1px;}
  .sidebar-nav{flex:1; display:flex; flex-direction:column; gap:4px;}
  .sidebar-item{
    display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px;
    border:none; background:none; color:var(--ink-soft); font-size:13.5px; font-weight:600; cursor:pointer; width:100%; text-align:left;
  }
  .sidebar-item:hover{background:var(--surface-alt);}
  .sidebar-item.active{background:var(--accent-soft); color:var(--accent-dark);}
  .sidebar-item .navicon{font-size:18px;}
  .sidebar-fab{
    margin-top:auto; padding:16px 8px 8px;
  }
  .sidebar-fab button{
    width:100%; background:var(--accent); color:#2A1707; border:none; border-radius:10px; padding:11px; font-weight:700; font-size:13.5px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .sidebar-fab button:hover{background:var(--accent-dark); color:#fff;}

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20;
    height:var(--topbar-h);
    background:var(--ink);
    color:#F7EFE2;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 16px;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:34px; height:34px; border-radius:9px;
    background:var(--accent);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:700; font-size:16px; color:#231508;
  }
  .brand-name{font-family:var(--font-display); font-weight:700; font-size:19px; line-height:1;}
  .brand-sub{font-size:10.5px; color:#C9B79C; letter-spacing:.04em; text-transform:uppercase; margin-top:2px;}
  .topbar-right{display:flex; align-items:center; gap:10px;}
  .sync-pill{
    display:flex; align-items:center; gap:6px;
    font-size:11px; padding:5px 9px; border-radius:99px;
    background:rgba(255,255,255,.08); color:#E9DCC8; cursor:pointer; border:none;
  }
  .sync-dot{width:7px; height:7px; border-radius:50%; background:var(--ink-faint); flex:none;}
  .sync-pill.synced .sync-dot{background:#8CB16E;}
  .sync-pill.offline .sync-dot{background:#E0A15C;}
  .sync-pill.syncing .sync-dot{background:#E9DCC8; animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  .avatar{
    width:32px; height:32px; border-radius:50%; background:var(--accent-soft); color:var(--accent-dark);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex:none;
    border:none; cursor:pointer;
  }

  /* ---------- Content ---------- */
  .content{flex:1; padding:16px 16px calc(var(--nav-h) + 24px); overflow-y:auto;}
  .section-title{font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin:22px 0 10px;}
  .section-title:first-child{margin-top:2px;}
  .greeting{font-size:23px; margin:4px 0 2px;}
  .greeting-sub{font-size:13.5px; color:var(--ink-soft); margin-bottom:16px;}

  /* ---------- Cards ---------- */
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; margin-bottom:12px; box-shadow:var(--shadow);
  }
  .card-hero{
    background:linear-gradient(135deg, var(--ink) 0%, #3A2A1C 100%);
    color:#F7EFE2; border:none;
  }
  .card-hero .muted{color:#C9B79C;}
  .hero-row{display:flex; align-items:flex-end; justify-content:space-between; gap:12px;}
  .hero-big{font-family:var(--font-mono); font-size:34px; font-weight:500; line-height:1;}
  .hero-label{font-size:12.5px; color:#C9B79C; margin-top:6px;}

  .empty-state{
    text-align:center; padding:34px 16px; color:var(--ink-soft);
    background:var(--surface-alt); border-radius:var(--radius); border:1px dashed var(--line);
  }
  .empty-state .icon{font-size:26px; margin-bottom:8px; display:block;}

  /* ---------- Badges ---------- */
  .badge{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600; padding:3px 9px; border-radius:99px; white-space:nowrap;}
  .badge-reguler{background:var(--po-soft); color:var(--po);}
  .badge-insidentil{background:var(--sm-soft); color:var(--accent-dark);}
  .badge-due{background:var(--warning-soft); color:var(--warning);}
  .badge-alert{background:var(--danger); color:#fff; animation:none;}
  .badge-overdue{background:var(--danger-soft); color:var(--danger);}
  .badge-done{background:var(--success-soft); color:var(--success);}
  .badge-dept-sm{background:var(--sm-soft); color:var(--sm);}
  .badge-dept-po{background:var(--po-soft); color:var(--po);}
  .badge-active{background:var(--surface-alt); color:var(--ink-soft);}
  .badge-ongoing{background:var(--po-soft); color:var(--po);}
  .badge-stop{background:var(--danger-soft); color:var(--danger);}
  .badge-mockup{background:linear-gradient(135deg,#E6DACB,#F0E6D6); color:var(--ink-soft); border:1px dashed var(--ink-faint);}

  /* ---------- Task table ---------- */
  .table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); margin-bottom:10px; -webkit-overflow-scrolling:touch;}
  .task-table{width:100%; min-width:600px; border-collapse:collapse; font-size:12.5px;}
  .task-table th{
    background:var(--surface-alt); text-align:left; padding:9px 11px; font-size:10.5px;
    text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); font-weight:700;
    position:sticky; top:0; white-space:nowrap; z-index:1;
  }
  .task-table td{padding:9px 11px; border-top:1px solid var(--line); vertical-align:top;}
  .task-table tr.task-row{cursor:pointer;}
  .task-table tr.task-row:hover td{background:var(--surface-alt);}
  .task-table tr.task-row.is-due td{background:#FBF3E4;}
  .task-table tr.task-row.is-overdue td{background:#FBEAE4;}
  .task-table td.col-task{font-weight:600; max-width:190px; white-space:normal; word-break:break-word; line-height:1.35;}
  .task-table td.col-progress{max-width:190px; color:var(--ink-soft); position:relative;}
  .task-table .cell-truncate{display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%;}
  .task-table td.col-progress .cell-truncate{padding-right:14px;}
  .task-table .chev{position:absolute; right:8px; top:9px; color:var(--ink-faint); font-size:12px;}
  .task-detail-row td{background:var(--surface-alt); padding:14px 12px; border-top:none;}

  /* ---------- Buttons ---------- */
  .btn{
    border:none; border-radius:10px; padding:10px 16px; font-weight:600; font-size:14px;
    cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn-primary{background:var(--accent); color:#2A1707;}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-ghost{background:transparent; color:var(--ink); border:1px solid var(--line);}
  .btn-danger-ghost{background:transparent; color:var(--danger); border:1px solid var(--danger-soft);}
  .btn-sm{padding:7px 11px; font-size:12.5px; border-radius:8px;}
  .btn-block{width:100%;}
  .btn:disabled{opacity:.5; cursor:default;}

  /* ---------- Task card ---------- */
  .task-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:10px;}
  .task-card.is-due{border-color:#E6C68E;}
  .task-card.is-overdue{border-color:#DBAA9B;}
  .task-title{font-size:15px; font-weight:600; margin:2px 0 6px;}
  .task-owner{font-size:12px; color:var(--ink-soft); margin-bottom:8px;}
  .task-badges{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px;}
  .task-note{font-size:13px; color:var(--ink-soft); background:var(--surface-alt); padding:8px 10px; border-radius:8px; margin:8px 0;}
  .task-actions{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .history{margin-top:10px; border-top:1px dashed var(--line); padding-top:10px;}
  .history-item{font-size:12.5px; padding:6px 0; border-bottom:1px solid var(--line);}
  .task-note a, .history-item a{color:var(--accent-dark); font-weight:600;}
  .history-item:last-child{border-bottom:none;}
  .history-date{font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); display:block; margin-bottom:2px;}

  /* ---------- Bottom nav (mobile) ---------- */
  .bottomnav{
    position:sticky; bottom:0; z-index:20;
    height:var(--nav-h); background:var(--surface); border-top:1px solid var(--line);
    display:flex; align-items:stretch; padding:0 6px;
  }
  .navitem{
    flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:3px; color:var(--ink-faint); font-size:10.5px; font-weight:600; cursor:pointer; padding:4px 0;
  }
  .navitem .navicon{font-size:19px;}
  .navitem.active{color:var(--accent-dark);}
  .navitem-fab{flex:none; width:54px; margin-top:-22px;}
  .fab-circle{
    width:54px; height:54px; border-radius:50%; background:var(--accent); color:#2A1707;
    display:flex; align-items:center; justify-content:center; font-size:24px; box-shadow:0 8px 16px -4px rgba(180,115,46,.55);
    border:3px solid var(--surface);
  }

  /* ---------- Sheet / Modal ---------- */
  .sheet-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.82); z-index:40;
    display:flex; align-items:flex-end; justify-content:center;
  }


  @media (min-width:560px){.sheet-overlay{align-items:center;}}
  .sheet{
    background:#FFFFFF; width:100%; max-width:480px; max-height:88vh; overflow-y:auto;
    border-radius:20px 20px 0 0; padding:18px 18px calc(env(safe-area-inset-bottom,0) + 20px);
    animation:slideup .22s ease-out;
    box-shadow:0 25px 80px rgba(0,0,0,.5);
    border:1px solid var(--line);
  }
  @media (min-width:560px){.sheet{border-radius:20px; margin-bottom:0; box-shadow:0 25px 80px rgba(0,0,0,.5);}}
  @keyframes slideup{from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .sheet-handle{width:36px; height:4px; background:var(--line); border-radius:99px; margin:0 auto 14px;}
  .sheet-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .sheet-close{background:var(--surface-alt); border:none; width:30px; height:30px; border-radius:50%; font-size:15px; cursor:pointer; color:var(--ink-soft);}
  .modetabs{display:flex; background:var(--surface-alt); border-radius:10px; padding:3px; margin-bottom:16px;}
  .modetab{flex:1; text-align:center; padding:8px; border-radius:8px; border:none; background:none; font-weight:600; font-size:13px; color:var(--ink-soft); cursor:pointer;}
  .modetab.active{background:var(--surface); color:var(--ink); box-shadow:var(--shadow);}

  /* ---------- Forms ---------- */
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px;}
  .field input[type=text],.field input[type=date],.field select,.field textarea{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px;
    font-family:inherit; font-size:14.5px; background:var(--surface); color:var(--ink);
  }
  .field textarea{resize:vertical; min-height:76px;}
  .hint{font-size:11.5px; color:var(--ink-faint); margin-top:5px;}
  .segmented{display:flex; gap:8px;}
  .segmented input{position:absolute; opacity:0; pointer-events:none;}
  .segmented label{
    flex:1; text-align:center; padding:10px 8px; border:1.5px solid var(--line); border-radius:10px;
    font-weight:600; font-size:13.5px; color:var(--ink-soft); cursor:pointer;
  }
  .segmented input:checked + label{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-dark);}
  .dept-display{font-size:13px; padding:8px 10px; background:var(--surface-alt); border-radius:8px; display:inline-flex; gap:6px; align-items:center;}

  /* ---------- Login screen ---------- */
  .login-wrap{min-height:100vh; display:flex; flex-direction:column; justify-content:center; padding:32px 24px;}
  .login-brand{text-align:center; margin-bottom:34px;}
  .login-brand .brand-mark{width:56px; height:56px; font-size:26px; margin:0 auto 12px;}
  .login-brand h1{font-size:27px;}
  .login-brand p{color:var(--ink-soft); font-size:13.5px; margin-top:6px;}
  .login-dept-label{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin:18px 0 8px;}
  .login-btn{
    width:100%; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:13px 14px; margin-bottom:8px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; box-shadow:var(--shadow);
  }
  .login-btn .name{font-weight:600; font-size:15px;}
  .login-btn .role{font-size:11px; color:var(--ink-soft);}

  /* ---------- Team recap ---------- */
  .team-summary{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:16px;}
  .stat{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 10px; text-align:center;}
  .stat .num{font-family:var(--font-mono); font-size:22px; font-weight:500;}
  .stat .lbl{font-size:10.5px; color:var(--ink-soft); margin-top:2px;}
  .person-block{margin-bottom:20px;}
  .person-head{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .person-head .avatar{width:26px; height:26px; font-size:11px;}
  .person-head .pname{font-weight:700; font-size:14.5px;}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed; left:50%; bottom:calc(var(--nav-h) + 14px); transform:translate(-50%,10px);
    background:var(--ink); color:#F7EFE2; padding:10px 18px; border-radius:99px; font-size:13px;
    opacity:0; pointer-events:none; transition:all .22s ease; z-index:60; max-width:88%; text-align:center;
    box-shadow:0 10px 24px -8px rgba(0,0,0,.4);
  }
  .toast.show{opacity:1; transform:translate(-50%,0);}

  .settings-row{display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--line);}
  .settings-row:last-child{border-bottom:none;}
  select.inline-select{padding:7px 10px; border-radius:8px; border:1px solid var(--line); font-family:inherit; font-size:13px; background:var(--surface);}
  input.inline-input{padding:7px 10px; border-radius:8px; border:1px solid var(--line); font-family:inherit; font-size:13px; background:var(--surface);}

  /* ---------- DASHBOARD STAFF ---------- */
  .profile-card{
    background:linear-gradient(135deg, var(--ink) 0%, #3A2A1C 100%);
    color:#F7EFE2; border-radius:var(--radius); padding:20px; margin-bottom:16px;
    display:flex; align-items:center; gap:14px;
  }
  .profile-card .avatar-big{
    width:56px; height:56px; border-radius:50%; background:var(--accent); color:#231508;
    display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:22px; flex:none;
  }
  .profile-card .p-name{font-family:var(--font-display); font-size:20px; font-weight:700;}
  .profile-card .p-role{font-size:12.5px; color:#C9B79C; margin-top:2px;}
  .profile-card .p-dept{font-size:11px; color:#A79683; margin-top:4px; display:inline-block; padding:3px 10px; background:rgba(255,255,255,.08); border-radius:99px;}

  .app-grid{display:grid; grid-template-columns:1fr; gap:10px; margin-bottom:16px;}
  .app-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; display:flex; align-items:center; gap:12px; cursor:pointer;
    box-shadow:var(--shadow); transition:transform .15s ease, box-shadow .15s ease;
  }
  .app-card:hover{transform:translateY(-2px); box-shadow:0 8px 24px -8px rgba(43,29,20,.2);}
  .app-card.active-app{border-color:var(--accent); background:linear-gradient(135deg, var(--surface), var(--accent-soft));}
  .app-icon{
    width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    font-size:20px; flex:none;
  }
  .app-icon.qtask{background:var(--sm-soft); color:var(--sm);}
  .app-icon.qfin{background:#E8F0FE; color:#1A73E8;}
  .app-icon.qsales{background:#FCE8E6; color:#C5221F;}
  .app-icon.qaff{background:#E6F4EA; color:#137333;}
  .app-icon.crm{background:#F3E8FD; color:#8430CE;}
  .app-icon.wabot{background:#FFF3E0; color:#E65100;}
  .app-info{flex:1;}
  .app-name{font-weight:700; font-size:15px;}
  .app-desc{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .app-status{font-size:10.5px; font-weight:700; margin-top:6px; display:inline-block; padding:3px 8px; border-radius:99px;}
  .app-status.live{background:var(--success-soft); color:var(--success);}

<script>
/* ============================================================

const CONFIG = {

  // config.js (dimuat lewat <script src="config.js"> di atas).
  // config.js TIDAK ikut di-commit ke repo publik (lihat .gitignore) —

  GAS_URL: (window.QSYSTEM_CONFIG && window.QSYSTEM_CONFIG.GAS_URL) || '',

}

function fmtRupiah(n){
  if (n === null || n === undefined || isNaN(n)) return 'Rp 0';
  const abs = Math.abs(Number(n));
  const s = abs.toLocaleString('id-ID');
  return (Number(n) < 0 ? '-Rp ' : 'Rp ') + s;
}
// BARU (2026-08-14): ubah 'yyyy-MM' jadi label bulan Indonesia singkat,
// dipakai QSales Klien Baru -- pakai MONTH_NAMES_ID yang sudah ada
// (dipakai juga oleh dropdown bulan Payroll), tidak duplikasi array nama bulan.
function qsalesMonthLabelID_(yyyyMM){
  const parts = String(yyyyMM || '').split('-');
  if (parts.length !== 2) return yyyyMM;
  const monthIdx = parseInt(parts[1], 10) - 1;
  const name = MONTH_NAMES_ID[monthIdx];
  return name ? (name + ' ' + parts[0]) : yyyyMM;
}

/* ============================================================
   API Layer — JSONP Mode (CORS-free via <script> tag)
   ============================================================ */
function isGASNative(){
  return (typeof google !== 'undefined' && google.script && google.script.run);
}

function gsNative(fnName, ...args){
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(reject)[fnName].apply(null, args);
  });
}

function gsJSONP(fnName, ...args){
  return new Promise((resolve, reject) => {
    // Build query parameters
    const params = new URLSearchParams();
    params.set('action', fnName);

    // DEBUG: log every API call
    console.log('[QSystem] API Call:', fnName, 'args:', args);

    if (fnName === 'updateMeetingSetting') {
      params.set('key', args[0]);
      params.set('value', args[1]);
    }
    else if (fnName === 'validatePin') {
      params.set('userId', args[0]);
      params.set('pin', args[1]);
    }
    else if (fnName === 'updatePin') {
      params.set('userId', args[0]);
      params.set('newPin', args[1]);
      params.set('oldPin', args[2] || '');
    }
    else if (fnName === 'addEmployee') {
      params.set('payload', JSON.stringify(args[0]));
    }
    else if (fnName === 'deleteEmployee') {
      params.set('userId', args[0]);
    }
    else if (fnName === 'toggleTaskStatus') {
      params.set('taskId', args[0]);
    }
    else if (fnName === 'qsales_getDashboard') {
      const opts = args[0] || {};
      const emp = findEmp(state.currentUser);
      const salesName = opts.salesName !== undefined ? opts.salesName : (emp ? emp.name : '');
      const userRole = opts.userRole !== undefined ? opts.userRole : (emp ? emp.role : 'staff');
      params.set('salesName', salesName);
      params.set('userRole', userRole);
      console.log('[gsJSONP] qsales_getDashboard params:', { salesName, userRole });
    }
    else if (fnName === 'qsales_getKPI') {
      const opts = args[0] || {};
      const emp = findEmp(state.currentUser);
      const salesName = opts.salesName !== undefined ? opts.salesName : (emp ? emp.name : '');
      const userRole = opts.userRole !== undefined ? opts.userRole : (emp ? emp.role : 'staff');
      params.set('salesName', salesName);
      params.set('userRole', userRole);
      console.log('[gsJSONP] qsales_getKPI params:', { salesName, userRole });
    }
    else if (fnName === 'getManagementNotes') {
      params.set('viewerId', args[0]);
      console.log('[gsJSONP] getManagementNotes viewerId:', args[0]);
    }
    else if (fnName === 'getAllManagementNotes') {
      // No params needed for owner
      console.log('[gsJSONP] getAllManagementNotes');
    }
    else if (fnName === 'deleteManagementNote') {
      params.set('id', args[0]);
      console.log('[gsJSONP] deleteManagementNote id:', args[0]);
    }
    else if (fnName === 'toggleManagementNote') {
      params.set('id', args[0]);
      params.set('isActive', String(args[1]));
      console.log('[gsJSONP] toggleManagementNote:', { id: args[0], isActive: args[1] });
    }
    else if (fnName === 'crm_updateLogStatus') {
      params.set('id', args[0]);
      params.set('status', args[1]);
    }
    else if (fnName === 'crm_deleteLog') {
      params.set('id', args[0]);
    }
    else if (args.length === 1) {
      params.set('payload', JSON.stringify(args[0]));
    }
    else if (args.length >= 2) {
      params.set('payload', JSON.stringify({ key: args[0], value: args[1] }));
    }

    // Unique callback name
    const cbName = '_qsjsonp_' + Date.now() + '_' + Math.random().toString(36).slice(2, 9);
    params.set('callback', cbName);

    const url = CONFIG.GAS_URL + '?' + params.toString();

    // Create script tag
    const script = document.createElement('script');
    script.src = url;
    script.async = true;

    // Timeout handler — dinaikkan dari 30 ke 45 detik (2026-08-13): terbukti
    // dari console log nyata bahwa response BISA datang SETELAH 30 detik
    // (terlihat dari ReferenceError pada callback yang sudah dihapus duluan
    // oleh cleanup() timeout -- artinya server SEBENARNYA berhasil, cuma
    // telat). Ini kemungkinan besar akibat kongesti/kuota platform Apps
    // Script, bukan bug kode -- menaikkan timeout memberi ruang lebih untuk
    // request yang lambat-tapi-sebenarnya-berhasil.
    const JSONP_TIMEOUT_MS = 45000;
    const timeoutId = setTimeout(() => {
      cleanup();
      console.error('[QSystem] JSONP TIMEOUT:', fnName, '— tidak ada respons dalam', JSONP_TIMEOUT_MS/1000, 'detik. URL:', url);
      reject(new Error('JSONP timeout — GAS tidak merespons dalam ' + (JSONP_TIMEOUT_MS/1000) + ' detik'));
    }, JSONP_TIMEOUT_MS);

    // Callback handler
    window[cbName] = function(resp) {
      cleanup();
      if (resp && resp.success) {
        console.log('[QSystem] API Response OK:', fnName, resp.data);
        resolve(resp.data);
      } else {
        console.error('[QSystem] API Response ERROR:', fnName, resp);
        reject(new Error((resp && resp.error) || 'API Error'));
      }
    };

    // Error handler
    script.onerror = function(evt) {
      cleanup();
      console.error('[QSystem] JSONP script.onerror triggered');
      console.error('  URL:', url);
      console.error('  Action:', fnName);
      console.error('  Event:', evt);
      reject(new Error('JSONP failed — GAS tidak merespons JS valid. Penyebab: (1) URL GAS salah/sudah expired, (2) GAS belum deploy ulang setelah revisi, (3) Ada error di server GAS (cek Execution Log), (4) Script GAS return HTML error page bukan JavaScript'));
    };

    // BARU (2026-08-13): SEBELUMNYA cleanup() pakai "delete window[cbName]" --
    // kalau responsnya BENAR-BENAR datang TERLAMBAT (setelah timeout sudah
    // reject duluan), script tag yang telat itu tetap coba manggil
    // window[cbName](...), tapi karena sudah di-delete, browser lempar
    // "Uncaught ReferenceError: ... is not defined" -- membingungkan dan
    // kelihatan seperti bug baru padahal cuma efek samping dari timeout yang
    // sudah lebih dulu menyerah. Sekarang diganti jadi FUNGSI KOSONG (no-op)
    // supaya respons telat itu diam-diam diabaikan, bukan melempar error.
    function cleanup() {
      clearTimeout(timeoutId);
      window[cbName] = function(){ /* respons datang setelah timeout, diabaikan */ };
      setTimeout(() => { delete window[cbName]; }, 60000); // beres-beres beneran setelah 1 menit
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    document.head.appendChild(script);
  });
}

/* ---------- Test koneksi ke GAS ---------- */
function testGASConnection(){
  return new Promise((resolve, reject) => {
    const cbName = '_qstest_' + Date.now();
    const testUrl = CONFIG.GAS_URL + '?action=getData&callback=' + cbName;
    console.log('[QSystem] Testing GAS connection:', testUrl);

    const script = document.createElement('script');
    script.src = testUrl;

    window[cbName] = function(resp) {
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
      console.log('[QSystem] GAS test response:', resp);
      resolve(resp);
    };

    script.onerror = function() {
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
      console.error('[QSystem] GAS test FAILED — URL tidak bisa diakses');
      reject(new Error('GAS URL tidak merespons'));
    };

    document.head.appendChild(script);
  });
}

/* ============================================================
   BARU (2026-08-22): buka portal QSales/QFin HARUS lewat sini --
   token sekali-pakai umur pendek diterbitkan dulu, portal (Sales
   Portal / QFin) memvalidasi token itu SEBELUM render apa pun.
   Mencegah akses langsung ke htmlnya masing-masing (bookmark/link
   lama) tanpa lewat QSystem.

   PENTING soal popup blocker: window.open() HARUS dipanggil LANGSUNG
   secara sinkron di dalam klik pengguna -- kalau dipanggil di dalam
   .then()/async callback SETELAH menunggu token, browser modern akan
   memblokirnya (dianggap bukan lagi "user gesture langsung"). Makanya
   tab KOSONG dibuka DULU secara sinkron, baru location-nya diarahkan
   belakangan setelah token siap.
   ============================================================ */
function openPortalWithToken(portal, baseUrl){
  const newTab = window.open('', '_blank');
  const emp = findEmp(state.currentUser);
  apiCall('issuePortalToken', { portal: portal, staffId: emp ? emp.name : state.currentUser }).then(result => {
    if (result && result.success && result.token) {
      newTab.location.href = baseUrl + (baseUrl.indexOf('?') === -1 ? '?' : '&') + 't=' + encodeURIComponent(result.token);
    } else {
      newTab.close();
      showToast('Gagal membuka portal: ' + ((result && result.error) || 'coba lagi'));
    }
  }).catch(err => {
    newTab.close();
    showToast('Gagal membuka portal: ' + (err.message || 'coba lagi'));
  });
}

function apiCall(fnName, ...args){
  if (isGASNative()) {
    return gsNative(fnName, ...args);
  } else {
    return gsJSONP(fnName, ...args);
  }
}

/* ============================================================
   Util
   ============================================================ */
function uid(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2,9);
}
function todayISO(){
  const d = new Date();
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
}
function pad(n){ return String(n).padStart(2,'0'); }
function fmtDate(dateStr){
  if(!dateStr) return '-';
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d)) return dateStr;
  return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
}
function daysSince(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.floor((today - d) / 86400000);
}
function daysUntil(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((d - today) / 86400000);
}
function escapeHTML(s){
  return String(s==null?'':s).replace(/[&<>">']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> t.classList.remove('show'), 2400);
}

/* ============================================================
   QTask — Perhitungan status
   ============================================================ */
function lastProgressDateFor(taskId){
  const entries = state.data.progress.filter(p=>p.taskId===taskId);
  if (!entries.length) return null;
  return entries.reduce((max,e)=> e.date > max ? e.date : max, entries[0].date);
}
function progressEntriesFor(taskId){
  return state.data.progress.filter(p=>p.taskId===taskId).sort((a,b)=> b.date===a.date ? b.createdAt-a.createdAt : (a.date < b.date ? 1 : -1));
}
function latestProgressStatus(taskId){
  const entries = progressEntriesFor(taskId);
  return entries[0] ? (entries[0].status || 'ongoing') : null;
}
function isDue(task){
  if (task.status !== 'aktif') return false;
  const last = lastProgressDateFor(task.id) || task.createdAt;
  return daysSince(last) >= 2;
}
function currentCycleStart(){
  const m = state.data.meeting;
  const resetWeekday = (m.weekday + 1) % 7;
  const now = new Date();
  const today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diff = (today0.getDay() - resetWeekday + 7) % 7;
  const start = new Date(today0);
  start.setDate(today0.getDate() - diff);
  return start;
}
function dateToISO(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function weekLabel(d){
  const startISO = dateToISO(d);
  const endISO = cycleEndISO(startISO);
  return fmtDate(startISO) + ' – ' + fmtDate(endISO);
}
function cycleStartForDate(dateStr){
  const m = state.data.meeting;
  const resetWeekday = (m.weekday + 1) % 7;
  const d = new Date(dateStr + 'T00:00:00');
  const diff = (d.getDay() - resetWeekday + 7) % 7;
  const start = new Date(d);
  start.setDate(d.getDate() - diff);
  return start;
}
function cycleEndISO(startISO){
  const end = new Date(startISO + 'T00:00:00');
  end.setDate(end.getDate() + 6);
  return dateToISO(end);
}
function weeklyMissCount(task){
  const cycleStart = dateToISO(currentCycleStart());
  const entries = progressEntriesFor(task.id).filter(e=>e.date >= cycleStart).sort((a,b)=> a.date<b.date?-1:1);
  const points = [cycleStart, ...entries.map(e=>e.date)];
  if (task.status === 'aktif') points.push(todayISO());
  let missed = 0;
  for (let i=0; i<points.length-1; i++){
    const diff = daysBetweenDates(points[i], points[i+1]);
    if (diff > 2) missed += Math.floor(diff/2);
  }
  return missed;
}
function isWeeklyDoubleMiss(task){
  if (task.status !== 'aktif') return false;
  return weeklyMissCount(task) >= 2;
}
function isOverdueInsidentil(task){
  if (task.type !== 'insidentil' || !task.timeline || task.status !== 'aktif') return false;
  return daysUntil(task.timeline) < 0;
}
function timelineBadge(task){
  const du = daysUntil(task.timeline);
  if (du < 0) return { cls:'badge-overdue', text:'Lewat ' + Math.abs(du) + 'h' };
  if (du === 0) return { cls:'badge-due', text:'Deadline hari ini' };
  if (du === 1) return { cls:'badge-due', text:'Besok deadline' };
  return { cls:'badge-reguler', text:'H-' + du };
}
function tasksOf(employeeId){
  return state.data.tasks.filter(t=>t.employeeId===employeeId).sort((a,b)=> (b.updatedAt||0)-(a.updatedAt||0));
}
function recentProgressForEmployee(employeeId, limit){
  const taskIds = new Set(state.data.tasks.filter(t => t.employeeId === employeeId).map(t => t.id));
  const taskById = {};
  state.data.tasks.forEach(t => { taskById[t.id] = t; });
  return state.data.progress
    .filter(p => taskIds.has(p.taskId))
    .slice()
    .sort((a,b)=> b.date===a.date ? (b.createdAt||0)-(a.createdAt||0) : (a.date < b.date ? 1 : -1))
    .slice(0, limit || 5)
    .map(p => Object.assign({}, p, { taskTitle: (taskById[p.taskId] || {}).title || '(task dihapus)' }));
}
function daysBetweenDates(a,b){
  const da = new Date(a + 'T00:00:00'), db = new Date(b + 'T00:00:00');
  return Math.round((db - da) / 86400000);
}
function normalizeNote(s){
  return String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
}
function computeTaskReport(task){
  const entries = state.data.progress.filter(p=>p.taskId===task.id).slice()
    .sort((a,b)=> a.date===b.date ? a.createdAt-b.createdAt : (a.date < b.date ? -1 : 1));
  const points = [task.createdAt, ...entries.map(e=>e.date)];
  if (task.status === 'aktif') points.push(todayISO());
  const gaps = [];
  for (let i=0; i<points.length-1; i++){
    const diff = daysBetweenDates(points[i], points[i+1]);
    if (diff > 2) gaps.push({ from:points[i], to:points[i+1], days:diff });
  }
  const duplicates = [];
  for (let i=1; i<entries.length; i++){
    const prev = normalizeNote(entries[i-1].note);
    const cur = normalizeNote(entries[i].note);
    if (prev && cur && prev === cur){
      duplicates.push({ date:entries[i].date, prevDate:entries[i-1].date, note:entries[i].note });
    }
  }
  return { gaps, duplicates, totalEntries: entries.length };
}

async function refreshData(){
  // BARU (2026-08-03): auto-retry SEKALI kalau percobaan pertama gagal --
  // terbukti (via Executions log QSystem) bahwa kegagalan seperti ini bisa
  // terjadi WALAU server sendiri berhasil eksekusi dengan cepat & bersih
  // (hambatan transport sesaat, bukan bug di kode) -- jadi retry singkat di
  // sisi browser adalah mitigasi yang tepat, sama seperti pola yang sudah
  // terbukti bekerja di fetchWabotStats().
  let gotData = false;
  for (let attempt = 1; attempt <= 2 && !gotData; attempt++) {
    try {
      state.data = await apiCall('getData');
      state.syncStatus = 'synced';
      state.lastSyncedAt = Date.now();
      gotData = true;
    } catch(e){
      if (attempt === 2) state.syncStatus = 'offline';
    }
  }
  if (state.currentUser) {
    fetchManagementNotes();
    // BARU (2026-08-18, FIX BUG NYATA): recordAttendance() SEBELUMNYA cuma
    // dipanggil SEKALI, tepat setelah login, fire-and-forget TANPA retry
    // (.catch(()=>{})). TERBUKTI dari laporan nyata: staff (Nanda) yang
    // GENUINELY sudah login dan aktif memakai QSystem TETAP dapat reminder
    // "belum login" -- artinya panggilan tunggal itu gagal diam-diam
    // (kemungkinan besar sama seperti transport hiccup yang sudah berkali-
    // kali ditemukan sepanjang malam ini utk getData/dsb), dan tidak ada
    // kesempatan kedua untuk berhasil. Sekarang DIPANGGIL ULANG di SETIAP
    // refreshData() (tiap 60 detik selama di tab dashboard/qtask, PLUS
    // instan tiap pindah ke tab itu) -- aman dipanggil berkali-kali karena
    // recordAttendance() di server SUDAH idempoten (tidak menulis apa-apa
    // kalau firstLoginAt hari ini sudah tercatat), jadi ini murni jaring
    // pengaman, bukan menambah beban tulis ke sheet.
    apiCall('recordAttendance', { staffId: state.currentUser }).catch(()=>{});
  }
  if (!state.modal.open && !state.mnModalOpen) render();
  else {
    const pill = document.querySelector('.sync-pill');
    if (pill) {
      const labelMap = { idle:'Memuat…', syncing:'Menyinkron…', synced:'Tersimpan', offline:'Gagal — tap utk coba lagi' };
      pill.className = 'sync-pill ' + state.syncStatus;
      const txt = pill.querySelector('.sync-label');
      if (txt) txt.textContent = labelMap[state.syncStatus] || '';
    }
  }
}
// BARU (2026-08-03, FIX MASALAH FUNDAMENTAL): sebelumnya refreshData() (yang
// memanggil getData + getAllManagementNotes) jalan tiap 30 detik TANPA PEDULI
// tab apa yang sedang aktif -- kalau user lagi di QFinance/CRM/QSales/WA Bot
// Admin, fetch ini TETAP jalan sia-sia di belakang layar (datanya bahkan
// tidak terlihat sama sekali di tab-tab itu), cuma menambah beban request
// yang berjalan bersamaan. Data ini (state.data, Management Notes) HANYA
// ditampilkan di tab 'dashboard'/'qtask' -- jadi polling-nya sekarang cuma

// BARU (2026-08-13, OPTIMASI KUOTA): interval dinaikkan dari 30 ke 60 detik.
// Ini SATU-SATUNYA sumber request TERBESAR di seluruh sistem -- tiap sesi
// staff yang lagi buka tab dashboard/qtask memicu 2-3 request (getData +

// hemat lebih jauh, bisa dinaikkan lagi (mis. 90000/120000) -- refreshData()

setInterval(()=>{

/* ============================================================
   Kalender .ics
   ============================================================ */
function toICSDate(d){
  return d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + 'T' + pad(d.getHours()) + pad(d.getMinutes()) + '00';
}
function buildICS(events){
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//QSystem//ID','CALSCALE:GREGORIAN'];
  events.forEach(ev=>{
    lines.push('BEGIN:VEVENT');
    lines.push('UID:' + ev.uid + '@qsystem.local');
    lines.push('DTSTAMP:' + toICSDate(new Date()) + 'Z');
    lines.push('DTSTART:' + toICSDate(ev.start));
    lines.push('DTEND:' + toICSDate(ev.end));
    if (ev.rrule) lines.push('RRULE:' + ev.rrule);
    lines.push('SUMMARY:' + ev.summary);
    if (ev.description) lines.push('DESCRIPTION:' + String(ev.description).replace(/\n/g,'\\n'));
    if (ev.alarm != null){
      lines.push('BEGIN:VALARM');
      lines.push('TRIGGER:-PT' + ev.alarm + 'M');
      lines.push('ACTION:DISPLAY');
      lines.push('DESCRIPTION:' + ev.summary);
      lines.push('END:VALARM');
    }
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}
function downloadICS(filename, events){
  const content = buildICS(events);
  const blob = new Blob([content], { type:'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function nextWeekdayDate(weekday, hour, minute){
  const now = new Date();
  const result = new Date(now);
  result.setHours(hour, minute, 0, 0);
  let diff = (weekday - now.getDay() + 7) % 7;
  if (diff === 0 && result <= now) diff = 7;
  result.setDate(now.getDate() + diff);
  return result;
}
function downloadMeetingReminders(){
  const m = state.data.meeting;
  const meetingStart = nextWeekdayDate(m.weekday, m.hour, m.minute);
  const meetingEnd = new Date(meetingStart.getTime() + 60*60000);
  const updateStart = new Date(); updateStart.setHours(m.updateHour,0,0,0);
  if (updateStart <= new Date()) updateStart.setDate(updateStart.getDate()+1);
  const updateEnd = new Date(updateStart.getTime() + 15*60000);
  downloadICS('qsystem-pengingat.ics', [
    {
      uid:'qsystem-meeting', start:meetingStart, end:meetingEnd,
      rrule:'FREQ=WEEKLY;BYDAY=' + ['SU','MO','TU','WE','TH','FR','SA'][m.weekday],
      summary:'Progress Meeting Mingguan (QSystem)',
      description:'Meeting offline membahas progress task tim minggu ini.',
      alarm:30,
    },
    {
      uid:'qsystem-update', start:updateStart, end:updateEnd,
      rrule:'FREQ=DAILY;INTERVAL=2',
      summary:'Isi Progress Task (QSystem)',
      description:'Waktunya update progress task kamu di aplikasi QSystem.',
      alarm:0,
    }
  ]);
  showToast('Pengingat kalender diunduh');
}
function openSheet(){
  if (state.data.sheetUrl){
    window.open(state.data.sheetUrl, '_blank');
  } else {
    showToast('Link Google Sheet belum tersedia');
  }
}
function downloadTaskDeadlineReminder(taskId){
  const task = state.data.tasks.find(t=>t.id===taskId);
  if (!task || !task.timeline) return;
  const start = new Date(task.timeline + 'T09:00:00');
  const end = new Date(start.getTime()+30*60000);
  downloadICS('qsystem-deadline-' + task.title.slice(0,20).replace(/[^a-z0-9]/gi,'-') + '.ics', [{
    uid:'qsystem-task-' + task.id, start, end,
    summary:'Deadline: ' + task.title,
    description:'Task insidentil dari ' + (findEmp(task.employeeId)||{}).name + ' — timeline ' + fmtDate(task.timeline),
    alarm:60*24,
  }]);
  showToast('Pengingat deadline diunduh');
}

  return task.type==='insidentil' ? `<span class="badge badge-insidentil">Insidentil</span>` : `<span class="badge badge-reguler">Reguler</span>`;

function statusBadgesHTML(task){
  let out = '';
  const pstatus = latestProgressStatus(task.id);
  if (pstatus === 'stop') out += `<span class="badge badge-stop">■ Stop</span>`;
  else if (pstatus === 'ongoing') out += `<span class="badge badge-ongoing">▶ Ongoing</span>`;
  if (task.status === 'selesai'){
    out += `<span class="badge badge-done">Selesai</span>`;
  } else {
    if (!pstatus) out += `<span class="badge badge-active">Belum ada progress</span>`;
    if (task.type==='insidentil' && task.timeline){
      const b = timelineBadge(task);
      out += `<span class="badge ${b.cls}">${b.text}</span>`;
    }
    if (isWeeklyDoubleMiss(task)) out += `<span class="badge badge-alert">⚠ 2x minggu ini</span>`;
    else if (isDue(task)) out += `<span class="badge badge-due">Perlu update</span>`;
  }
  return out;
}

function reportTableHTML(reports, opts){
  opts = opts || {};
  if (!reports.length){
    return `<div class="empty-state"><span class="icon">✅</span>Tidak ada tanggal kosong atau progress duplikat saat ini.</div>`;
  }
  const colCount = opts.showEmployee ? 4 : 3;
  const rows = reports.map(r=>{
    const t = r.task;
    const emp = findEmp(t.employeeId);
    const key = 'report-' + t.id;
    const expanded = !!state.expanded[key];
    return `
      <tr class="task-row" data-action="toggle-report" data-task="${t.id}">
        ${opts.showEmployee ? `<td>${emp.name}</td>` : ''}
        <td class="col-task">${escapeHTML(t.title)}</td>
        <td>${r.gaps.length ? `<span class="badge badge-overdue">${r.gaps.length} kosong</span>` : `<span class="badge badge-done">Lengkap</span>`}</td>
        <td>${r.duplicates.length ? `<span class="badge badge-due">${r.duplicates.length} duplikat</span>` : `<span class="faint">–</span>`}</td>
      </tr>
      ${expanded ? `
      <tr class="task-detail-row">
        <td colspan="${colCount}">
          ${r.gaps.length ? `
            <p class="muted" style="font-size:12px; font-weight:700; margin-bottom:6px;">📅 Tanggal kosong (tidak ada progress):</p>
            ${r.gaps.map(g=>`<div class="history-item">${fmtDate(g.from)} → ${fmtDate(g.to)} <span class="faint">(${g.days} hari tanpa update)</span></div>`).join('')}
          ` : ''}
          ${r.duplicates.length ? `
            <p class="muted" style="font-size:12px; font-weight:700; margin:10px 0 6px;">⧉ Progress sama seperti update sebelumnya:</p>
            ${r.duplicates.map(d=>`
              <div class="history-item">
                <span class="history-date">${fmtDate(d.date)} — isinya sama dengan ${fmtDate(d.prevDate)}</span>
                ${escapeHTML(d.note)}
              </div>
            `).join('')}
          ` : ''}
        </td>
      </tr>
      ` : ''}
    `;
  }).join('');
  return `
    <div class="table-wrap">
      <table class="task-table">
        <thead>
          <tr>
            ${opts.showEmployee ? '<th>Nama</th>' : ''}
            <th>Task</th><th>Tanggal Kosong</th><th>Duplikat</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}
function filterBarHTML(memberIds, showDeptFilter){
  const namaOptions = memberIds.map(id=>{
    const e = findEmp(id);
    return `<option value="${id}" ${state.filter.nama===id?'selected':''}>${e.name}</option>`;
  }).join('');
  const active = state.filter.dept!=='all' || state.filter.nama!=='all';
  return `
    <div class="row gap-8 wrap" style="margin-bottom:14px;">
      ${showDeptFilter ? `
      <select class="inline-select" data-action="set-filter-dept">

        <option value="sm" ${state.filter.dept==='sm'?'selected':''}>${DEPT_NAMES.sm}</option>
        <option value="po" ${state.filter.dept==='po'?'selected':''}>${DEPT_NAMES.po}</option>
      </select>
      ` : ''}
      <select class="inline-select" data-action="set-filter-nama">
        <option value="all" ${state.filter.nama==='all'?'selected':''}>Semua Nama</option>
        ${namaOptions}
      </select>
      ${active ? `<button class="btn btn-ghost btn-sm" data-action="reset-filter">✕ Reset</button>` : ''}
    </div>
  `;
}
function applyFilter(tasks){
  return tasks.filter(t=>{
    if (state.filter.dept!=='all' && t.dept!==state.filter.dept) return false;
    if (state.filter.nama!=='all' && t.employeeId!==state.filter.nama) return false;
    return true;
  });
}

function qtaskReportHTML(){
  const spv = hasTeamView(state.currentUser);
  const crossDept = findEmp(state.currentUser).role === 'owner';
  const memberIds = spv ? TEAM_OF[state.currentUser] : [state.currentUser];
  const scopeIds = spv ? TEAM_OF[state.currentUser] : [state.currentUser];
  const tasks = applyFilter(scopeIds.flatMap(id=>tasksOf(id)).filter(t=>t.status==='aktif'));
  const ongoingTasks = tasks.filter(t=>latestProgressStatus(t.id)==='ongoing');
  const stopTasks = tasks.filter(t=>latestProgressStatus(t.id)==='stop');
  const noProgressTasks = tasks.filter(t=>!latestProgressStatus(t.id));

async function fetchQSalesData(){
  if (state.qsalesLoading) return;
  state.qsalesLoading = true;
  state.qsalesError = null;
  render();
  try {
    const emp = findEmp(state.currentUser);
    const isStaff = emp && emp.role === 'staff';
    let salesName, userRole;
    if (isStaff) {
      salesName = emp ? emp.name : '';
      userRole = emp ? emp.role : 'staff';
    } else {
      // Owner/Spv: gunakan filter jika dipilih, kosong = semua
      salesName = state.qsalesFilterSales !== 'all' ? state.qsalesFilterSales : '';
      userRole = emp ? emp.role : 'owner';
    }
    console.log('[QSales] FETCH DASHBOARD START');
    console.log('  currentUser:', state.currentUser);
    console.log('  qsalesFilterSales:', state.qsalesFilterSales);
    console.log('  isStaff:', isStaff);
    console.log('  salesName:', salesName || '(all/empty)');
    console.log('  userRole:', userRole);
    const result = await apiCall('qsales_getDashboard', { salesName, userRole });
    console.log('[QSales] FETCH DASHBOARD RESULT:', result);
    console.log('[QSales] Response:', result);
    if (result && typeof result === 'object') {
      state.qsalesData = result;
    } else {
      throw new Error('Response tidak valid dari server');
    }
    state.qsalesLoading = false;
  } catch(e) {
    console.error('[QSales] Fetch error:', e);
    state.qsalesLoading = false;
    state.qsalesError = e.message || 'Gagal memuat data QSales. Pastikan GAS sudah deploy dengan file 06_QSales.gs';
    showToast('QSales: ' + state.qsalesError);
  }
  render();
}

      ${d.piutangReminders.map(r => `
        <div style="padding:8px 0; border-top:1px dashed #E8B4A8; display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
          <div style="min-width:0;">
            <div style="font-weight:600; font-size:12.5px;">${escapeHTML(r.customerName)}</div>

          <button class="btn btn-ghost btn-sm" data-action="ack-piutang-reminder" data-id="${escapeHTML(r.id)}" style="padding:3px 8px; font-size:10.5px; white-space:nowrap;">✓ Sudah Dibaca</button>
        </div>
      `).join('')}
    </div>
    ` : ''}

    ${d.kunjunganSchedule && d.kunjunganSchedule.upcoming.length > 0 ? `
    <div class="card" style="background:#E8F0FB; border-color:#B8D0EC; margin-bottom:16px;">
      <div class="row gap-8" style="margin-bottom:4px;"><b style="color:#2E5C8A;">📅 ${d.kunjunganSchedule.upcoming.length} kunjungan (appointment) akan datang</b></div>
      <div class="faint" style="font-size:10.5px; margin-bottom:8px;">Beda dari "Visit Ke" biasa -- ini kedatangan yang SUDAH ADA JANJI (meeting/demo), dicatat lewat Sales Portal.</div>
      ${d.kunjunganSchedule.upcoming.map(k => `
        <div style="padding:8px 0; border-top:1px dashed #B8D0EC;">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
            <div style="min-width:0;">
              <div style="font-weight:600; font-size:12.5px;">${escapeHTML(k.namaToko)}</div>
              <div class="faint" style="font-size:11px;">${escapeHTML(k.keperluan || 'Keperluan belum diisi')}${(!d.filteredBy || d.filteredBy === 'all') ? ' · ' + escapeHTML(k.salesman) : ''}</div>

            <div style="font-weight:700; font-size:12px; color:#2E5C8A; white-space:nowrap;">${escapeHTML(k.tanggal)}</div>
          </div>
        </div>
      `).join('')}
    </div>
    ` : ''}

    ${reminderTotal > 0 ? `
    <div class="card" style="background:var(--warning-soft); border-color:#E6C68E; margin-bottom:16px;">
      <div class="row gap-8" style="margin-bottom:8px;"><b style="color:var(--warning);">⚠ ${reminderTotal} coffee shop perlu ditindaklanjuti</b></div>
      <div style="font-size:13px; color:var(--ink-soft);">
        ${d.needV2 > 0 ? `<div>• ${d.needV2} butuh Visit Ke-2 (V1→V2)</div>` : ''}
        ${d.needV3 > 0 ? `<div>• ${d.needV3} butuh Visit Ke-3 (V2→V3)</div>` : ''}
        ${d.v3Ongoing > 0 ? `<div>• ${d.v3Ongoing} V3 selesai tapi belum closing</div>` : ''}
      </div>
    </div>
    ` : ''}

    ${isOwner && (d.unmatchedCustomers || []).length > 0 ? `
    <div class="section-title">🔍 Customer GL Tanpa Jejak Lead</div>
    <div class="card" style="background:var(--surface-alt);">
      <div class="faint" style="font-size:11.5px; margin-bottom:10px;">Customer ini punya invoice nyata di GL, tapi nama-nya tidak bisa dihubungkan (lewat nomor telepon atau nama) ke lead manapun di ENTRY -- kemungkinan konsumen lama (sebelum QSales dipakai) atau butuh verifikasi manual.</div>
      <div style="font-size:12px; max-height:220px; overflow-y:auto;">
        ${d.unmatchedCustomers.filter(c => c.revenue > 0).sort((a,b) => b.revenue - a.revenue).map(c => `
          <div style="display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid var(--line);">
            <div>${escapeHTML(c.name)}${c.note ? `<div class="faint" style="font-size:10px; color:var(--warning);">${escapeHTML(c.note)}</div>` : ''}</div>
            <div style="font-weight:600; white-space:nowrap; margin-left:8px;">${fmtRupiah(c.revenue)}</div>
          </div>
        `).join('')}
      </div>
    </div>
    ` : ''}

    <div class="section-title">Aksi Cepat</div>
    <div class="app-grid" style="grid-template-columns:repeat(2,1fr);">
      <div class="app-card" onclick="openPortalWithToken('qsales', CONFIG.QSALES_PORTAL_URL)">
        <div class="app-icon qsales">🎯</div>
        <div class="app-info">
          <div class="app-name">Buka Portal QSales</div>
          <div class="app-desc">Akses fitur lengkap: peta, chart, AI analysis, entry form</div>
        </div>
      </div>
      <div class="app-card" data-action="qsales-refresh">
        <div class="app-icon" style="background:var(--surface-alt); color:var(--ink-soft);">🔄</div>
        <div class="app-info">
          <div class="app-name">Refresh Data</div>
          <div class="app-desc">Muat ulang data leads terbaru dari Google Sheet</div>
        </div>
      </div>
    </div>

    <div class="section-title">
      Coffee Shop Terbaru 
      <span class="faint" style="font-size:11px; font-weight:400;">(50 data terakhir${d.filteredBy && d.filteredBy !== 'all' ? ' · Filter: ' + escapeHTML(d.filteredBy) : ''})</span>
    </div>
    ${qsalesShopListHTML(d.shops || [])}
  `;
}

function qsalesShopListHTML(shops){
  if (!shops.length){
    return `<div class="empty-state"><span class="icon">🗂️</span>Belum ada data coffee shop.</div>`;
  }
  const rows = shops.map(s => {
    let statusColor = 'var(--po)';
    let statusLabel = 'On Going';
    if (s.status === 'stop') { statusColor = 'var(--danger)'; statusLabel = 'Stop'; }
    else if (s.status === 'closing') { statusColor = 'var(--success)'; statusLabel = 'Jadi Klien'; }
    const visitLabel = s.latestVisit || 'Pertama';
    const vBadge = visitLabel === 'Pertama' ? 'badge-reguler' : visitLabel === 'Kedua' ? 'badge-due' : 'badge-insidentil';
    return `
      <div class="task-card" style="margin-bottom:8px;">
        <div class="row between" style="margin-bottom:6px;">
          <div class="task-title" style="font-size:14px;">${escapeHTML(s.name)}</div>
          <span class="badge" style="background:${statusColor}20; color:${statusColor};">${statusLabel}</span>
        </div>
        <div class="task-owner">${escapeHTML(s.sales)} · ${escapeHTML(s.area || 'Area tidak diketahui')}</div>
        ${s.status === 'closing' && s.glRevenue > 0 ? `
          <div style="font-size:12px; font-weight:700; color:var(--success); margin-top:4px;">
            💰 ${fmtRupiah(s.glRevenue)} <span class="faint" style="font-weight:400;">(terverifikasi GL${s.glCustomerName && s.glCustomerName !== s.name ? ' · sbg "' + escapeHTML(s.glCustomerName) + '"' : ''})</span>
          </div>
        ` : ''}
        <div class="task-badges">
          <span class="badge ${vBadge}">${visitLabel}</span>
          ${s.bahan ? `<span class="badge badge-active">${escapeHTML(s.bahan)}</span>` : ''}
          ${s.kopi ? `<span class="badge badge-active">${escapeHTML(s.kopi)}</span>` : ''}
        </div>
        ${s.daysSinceV1 !== null ? `<div class="faint mono" style="font-size:10.5px;">V1: ${s.v1Date || '-'} (${s.daysSinceV1}h lalu)</div>` : ''}
        ${s.daysSinceV2 !== null ? `<div class="faint mono" style="font-size:10.5px;">V2: ${s.v2Date || '-'} (${s.daysSinceV2}h lalu)</div>` : ''}
      </div>
    `;
  }).join('');
  return rows;
}

function qsalesLeadsHTML(){
  const d = state.qsalesData;
  if (!d) return `<div class="empty-state">Memuat...</div>`;
  let needFollowUp = (d.shops || []).filter(s => s.status !== 'stop' && s.status !== 'closing');
  const totalLeads = needFollowUp.length;
  needFollowUp = needFollowUp.slice(0, 50);
  const emp = findEmp(state.currentUser);
  const isStaff = emp && emp.role === 'staff';
  return `
    <div class="greeting">Daftar Leads</div>
    <div class="greeting-sub">
      ${needFollowUp.length} coffee shop sedang di-follow up
      ${totalLeads > 50 ? '<span class="faint">(ditampilkan 50 terakhir dari ' + totalLeads + ')</span>' : ''}
      ${isStaff ? `<span class="badge badge-active" style="margin-left:6px;">👤 ${escapeHTML(emp.name)}</span>` : ''}
    </div>
    ${qsalesSubNavHTML()}
    ${qsalesShopListHTML(needFollowUp)}
  `;
}

function qsalesKunjunganHTML(){
  return `
    <div class="greeting">Jadwal Kunjungan</div>
    <div class="greeting-sub">Rencana kunjungan dari QSales</div>
    ${qsalesSubNavHTML()}
    <div class="card" style="text-align:center; padding:40px 20px;">
      <span class="icon" style="font-size:32px; margin-bottom:12px; display:block;">📅</span>
      <p style="color:var(--ink-soft); font-size:13px; margin-bottom:16px;">Jadwal kunjungan lengkap tersedia di Portal QSales.</p>
      <button class="btn btn-primary" onclick="openPortalWithToken('qsales', CONFIG.QSALES_PORTAL_URL)">Buka Portal QSales</button>
    </div>
  `;
}


/* ============================================================
   QSALES — KPI Dashboard HTML
   ============================================================ */
function qsalesKPIHTML(){
  if (state.qsalesKPILoading){
    return `
      <div class="empty-state"><span class="icon">📊</span><p>Menghitung KPI Sales...</p></div>
    `;
  }
  if (state.qsalesKPIError){
    return `
      <div class="greeting">KPI Sales 📈</div>
      <div class="greeting-sub">Gagal memuat data KPI</div>
      <div class="card" style="background:var(--danger-soft); border-color:var(--danger-soft);">
        <div style="font-size:13px; color:var(--danger); margin-bottom:10px;">
          <b>⚠ Error:</b> ${escapeHTML(state.qsalesKPIError)}
        </div>
        <div style="font-size:12px; color:var(--ink-soft); margin-bottom:12px;">
          Penyebab umum:<br>
          1. GAS belum deploy dengan file 06_QSales.gs (revisi KPI)<br>
          2. URL GAS belum diupdate di CONFIG<br>
          3. Sheet ENTRY belum ada di spreadsheet
        </div>
        <button class="btn btn-primary" data-action="qsales-refresh">🔄 Coba Lagi</button>
      </div>
    `;
  }
  const d = state.qsalesKPIData;
  if (!d){
    fetchQSalesKPI();
    return `<div class="empty-state"><p>Memuat data KPI...</p></div>`;
  }

  const emp = findEmp(state.currentUser);
  const isStaff = emp && emp.role === 'staff';
  const isSpvOrOwner = emp && (emp.role === 'spv' || emp.role === 'owner');
  const summary = d.summary || {};
  const monthly = d.monthly || [];
  const weekly = d.weekly || [];
  const daily = d.daily || [];

  // Build sales filter dropdown for owner/spv
  const salesFilterHTML = isSpvOrOwner ? `
    <div class="row gap-8 wrap" style="margin-bottom:14px;">
      <select class="inline-select" data-action="set-qsales-filter">
        <option value="all" ${state.qsalesFilterSales==='all'?'selected':''}>👥 Semua Sales</option>
        ${getSalesNames().map(n=>`<option value="${escapeHTML(n)}" ${state.qsalesFilterSales===n?'selected':''}>👤 ${escapeHTML(n)}</option>`).join('')}
      </select>
      ${state.qsalesFilterSales !== 'all' ? `<button class="btn btn-ghost btn-sm" data-action="reset-qsales-filter">✕ Reset</button>` : ''}
    </div>
  ` : '';

  // Monthly HTML
  const monthlyHTML = monthly.map(m => {
    const achievementRate = m.target > 0 ? Math.round((m.totalVisit / m.target) * 100) : 0;
    const isAchieved = m.status === 'TERCAPAI';
    const statusColor = isAchieved ? 'var(--success)' : 'var(--warning)';

    const salesBreakdown = (m.bySales || []).map(bs => {
      const bsRate = m.target > 0 ? Math.round((bs.count / m.target) * 100) : 0;
      return `<div style="display:flex; justify-content:space-between; align-items:center; padding:4px 0; border-bottom:1px solid var(--line); font-size:12px;">
        <span>${escapeHTML(bs.sales)}</span>
        <span><b>${bs.count}</b> visit <span style="color:var(--ink-faint);">(${bsRate}%)</span> · <b>${bs.visitDays||0}</b> hari visit</span>
      </div>`;
    }).join('');

    return `
      <div class="card" style="margin-bottom:10px; border-left:4px solid ${statusColor};">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px;">
          <div>
            <div style="font-weight:700; font-size:15px;">${escapeHTML(m.monthName)}</div>
            <div style="font-size:12px; color:var(--ink-soft); margin-top:2px;">
              ${m.isCurrentMonth ? '<span class="badge badge-ongoing">Bulan Ini</span> ' : ''}
              ${m.workingDays} hari kerja · ${m.effectiveDays} hari efektif
            </div>
          </div>
          <div style="text-align:right;">
            <div style="font-family:var(--font-mono); font-size:24px; font-weight:500; color:${statusColor};">${m.totalVisit}</div>
            <div style="font-size:11px; color:var(--ink-soft);">dari ${m.target} target</div>
          </div>
        </div>
        <div style="background:var(--surface-alt); border-radius:8px; padding:8px 10px; margin-bottom:8px;">
          <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px;">
            <span>Pencapaian</span>
            <span style="font-weight:700; color:${statusColor};">${achievementRate}%</span>
          </div>
          <div style="height:6px; background:var(--line); border-radius:99px; overflow:hidden;">
            <div style="height:100%; width:${Math.min(achievementRate, 100)}%; background:${statusColor}; border-radius:99px; transition:width .3s ease;"></div>
          </div>
        </div>
        ${!isStaff ? `<div style="margin-top:8px;">
          <div style="font-size:11px; font-weight:700; text-transform:uppercase; color:var(--ink-soft); margin-bottom:4px; letter-spacing:.04em;">Per Sales</div>
          ${salesBreakdown || '<div style="font-size:12px; color:var(--ink-faint);">Tidak ada data</div>'}
        </div>` : ''}
        ${m.gap > 0 ? `<div style="font-size:12px; color:var(--danger); margin-top:6px;">⚠ Kurang ${m.gap} visit untuk mencapai target</div>` : ''}
        ${isAchieved ? `<div style="font-size:12px; color:var(--success); margin-top:6px;">✅ Target bulanan tercapai!</div>` : ''}
      </div>
    `;
  }).join('');

  // Weekly HTML (last 8 weeks)
  const weeklyHTML = weekly.slice(-8).reverse().map(w => {
    const isAchieved = w.status === 'TERCAPAI';
    const statusColor = isAchieved ? 'var(--success)' : 'var(--warning)';
    return `
      <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 12px; border-bottom:1px solid var(--line); background:var(--surface);">
        <div>
          <div style="font-weight:600; font-size:13px;">${escapeHTML(w.weekLabel)}</div>
          <div style="font-size:11px; color:var(--ink-soft);">${w.month} · ${w.visitDays || 0} hari kerja</div>
        </div>
        <div style="text-align:right;">
          <div style="font-family:var(--font-mono); font-size:18px; font-weight:500; color:${statusColor};">${w.totalVisit}</div>
          <div style="font-size:11px; color:var(--ink-soft);">/ ${w.target}</div>
        </div>
      </div>
    `;
  }).join('');

  // Daily HTML (last 14 days) -- expandable, menampilkan JADWAL KUNJUNGAN
  // (nama shop + area + visit ke), bukan cuma hitung V1/V2/V3 agregat.
  const dailyHTML = daily.slice(-14).reverse().map(day => {
    const isAchieved = day.status === 'TERCAPAI';
    const statusColor = isAchieved ? 'var(--success)' : (day.isWorkingDay ? 'var(--danger)' : 'var(--ink-faint)');
    const dateObj = new Date(day.date + 'T00:00:00');
    const dayName = DAYS_ID[dateObj.getDay()];
    const isOpen = (state.kpiExpandedDays || []).includes(day.date);
    const hasSchedule = (day.visitList || []).length > 0;
    return `
      <div style="border-bottom:1px solid var(--line); ${!day.isWorkingDay ? 'opacity:.6;' : ''}">
        <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 10px; ${hasSchedule ? 'cursor:pointer;' : ''}" ${hasSchedule ? `data-action="toggle-kpi-day" data-date="${escapeHTML(day.date)}"` : ''}>
          <div style="display:flex; align-items:center; gap:6px;">
            ${hasSchedule ? `<span class="chev" style="color:var(--ink-faint); font-size:10px;">${isOpen ? '⌃' : '⌄'}</span>` : ''}
            <div>
              <div style="font-weight:600; font-size:12px;">${dayName}, ${fmtDate(day.date)}</div>
              <div style="font-size:11px; color:var(--ink-soft);">
                ${day.isWorkingDay ? 'Hari Kerja' : 'Libur'}
                ${day.visit1 > 0 ? ` · V1:${day.visit1}` : ''}
                ${day.visit2 > 0 ? ` · V2:${day.visit2}` : ''}
                ${day.visit3 > 0 ? ` · V3:${day.visit3}` : ''}
              </div>
            </div>
          </div>
          <div style="text-align:right;">
            <div style="font-family:var(--font-mono); font-size:16px; font-weight:500; color:${statusColor};">${day.totalVisit}</div>
            <div style="font-size:10px; color:var(--ink-soft);">/ ${day.target}</div>
          </div>
        </div>
        ${isOpen && hasSchedule ? `
          <div style="padding:0 10px 10px 26px;">
            <div class="faint" style="font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; margin-bottom:4px;">Jadwal Kunjungan</div>
            ${day.visitList.map(v => `
              <div style="display:flex; justify-content:space-between; font-size:11.5px; padding:3px 0; border-top:1px dashed var(--line);">
                <div>${escapeHTML(v.shop || '(tanpa nama)')}${v.area ? ` <span class="faint">· ${escapeHTML(v.area)}</span>` : ''}${!isStaff ? ` <span class="faint">· ${escapeHTML(v.sales)}</span>` : ''}</div>
                <div class="faint">V${v.visitKe}</div>
              </div>
            `).join('')}
          </div>
        ` : ''}
      </div>
    `;
  }).join('');

  // First entry info
  const firstEntryHTML = (d.salesFirstEntry || []).map(fe => `
    <div style="font-size:12px; color:var(--ink-soft); padding:2px 0;">
      ${escapeHTML(fe.sales)}: mulai ${fmtDate(fe.firstDate)}
    </div>
  `).join('');

  return `
    <div class="greeting">KPI Sales 📈</div>
    <div class="greeting-sub">
      Target: ${d.dailyTarget} visit/hari · ${d.workDaysPerWeek} hari/minggu
      ${isStaff ? `<span class="badge badge-active" style="margin-left:6px;">👤 ${escapeHTML(emp.name)}</span>` : ''}
      ${isSpvOrOwner && state.qsalesFilterSales !== 'all' ? `<span class="badge badge-active" style="margin-left:6px;">👤 Filter: ${escapeHTML(state.qsalesFilterSales)}</span>` : ''}
    </div>

    ${salesFilterHTML}
    ${qsalesSubNavHTML()}

    <div class="section-title">Ringkasan Pencapaian</div>
    <div class="quick-stats">
      <div class="qstat">
        <div class="qnum" style="color:var(--accent-dark);">${summary.daysAchieved || 0}</div>
        <div class="qlbl">Hari Tercapai</div>
      </div>
      <div class="qstat">
        <div class="qnum" style="color:var(--po);">${summary.totalDaysTracked || 0}</div>
        <div class="qlbl">Total Hari Tracked</div>
      </div>
      <div class="qstat">
        <div class="qnum" style="color:${summary.daysAchievementRate >= 80 ? 'var(--success)' : summary.daysAchievementRate >= 50 ? 'var(--warning)' : 'var(--danger)'}">${summary.daysAchievementRate || 0}%</div>
        <div class="qlbl">Achievement Rate</div>
      </div>
      <div class="qstat">
        <div class="qnum" style="color:var(--accent-dark);">${summary.currentWeeksAchieved || 0}/${summary.currentWeeksTracked || 0}</div>
        <div class="qlbl">Minggu Tercapai</div>
      </div>
    </div>

    ${summary.currentMonth ? `
    <div class="card" style="background:linear-gradient(135deg, var(--accent-soft) 0%, var(--surface) 100%); border-color:var(--accent); margin-bottom:16px;">
      <div style="font-weight:700; font-size:15px; margin-bottom:8px;">📅 Bulan Berjalan: ${escapeHTML(summary.currentMonth.monthName)}</div>
      <div style="display:grid; grid-template-columns:repeat(2, 1fr); gap:12px;">
        <div>
          <div style="font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em;">Target s.d. Hari Ini</div>
          <div style="font-family:var(--font-mono); font-size:22px; font-weight:500;">${summary.currentMonth.target}</div>
          ${summary.currentMonth.dailyTarget ? `<div style="font-size:10.5px; color:var(--ink-soft);">${summary.currentMonth.dailyTarget}/hari × ${summary.currentMonth.effectiveDays} hari efektif</div>` : ''}
        </div>
        <div>
          <div style="font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em;">Realisasi</div>
          <div style="font-family:var(--font-mono); font-size:22px; font-weight:500; color:${summary.currentMonth.status === 'TERCAPAI' ? 'var(--success)' : 'var(--accent-dark)'}">${summary.currentMonth.totalVisit}</div>
        </div>
        <div>
          <div style="font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em;">Hari Kerja</div>
          <div style="font-size:18px; font-weight:600;">${summary.currentMonth.workingDays}</div>
          ${summary.currentMonth.fullMonthTarget ? `<div style="font-size:10.5px; color:var(--ink-soft);">target 1 bulan penuh: ${summary.currentMonth.fullMonthTarget}</div>` : ''}
        </div>

      ${summary.currentMonth.status === 'TERCAPAI' ? `<div style="margin-top:10px; font-size:12px; color:var(--success);">✅ Target s.d. hari ini tercapai!</div>` : ''}
    </div>

async function savePayrollRates(){
  const rows = document.querySelectorAll('[data-payroll-rate-row]');
  const updates = [];
  rows.forEach(row => {
    const id = row.getAttribute('data-payroll-rate-row');
    const gaji = row.querySelector('[data-field="gaji"]').value;
    const harian = row.querySelector('[data-field="harian"]').value;
    const feeMarketingPct = row.querySelector('[data-field="feeMarketingPct"]').value;
    const feeRoastRate = row.querySelector('[data-field="feeRoastRate"]').value;
    updates.push({
      id: id,
      gaji: Number(gaji) || 0,
      harian: Number(harian) || 0,
      feeMarketingPct: Number(feeMarketingPct) || 0,
      feeRoastRate: Number(feeRoastRate) || 0
    });
  });

  state.payrollRatesSaving = true;
  render();
  try {
    const result = await apiCall('updateEmployeePayrollRates', { requestingUserId: state.currentUser, updates: updates });
    if (result && result.success) {
      showToast(result.message || 'Rate berhasil disimpan');
      state.payrollRatesSaving = false;
      await fetchPayrollRates(); // muat ulang supaya tampilan sinkron dengan sheet
    } else {
      throw new Error((result && result.error) || 'Gagal menyimpan');
    }
  } catch(e) {
    state.payrollRatesSaving = false;
    showToast('Gagal menyimpan: ' + (e.message || 'Coba lagi'));
  }
  render();
}

function qfinDashboardHTML(){
  const emp = findEmp(state.currentUser);
  const canSeeTab = emp && (emp.role === 'spv' || emp.role === 'owner');
  if (!canSeeTab) {
    return `
      <div class="greeting">QFinance 💰</div>

      <div class="card" style="background:var(--danger-soft); border-color:var(--danger-soft);">
        <div style="font-size:13px; color:var(--danger); margin-bottom:10px;">
          <b>⚠ Akses Ditolak:</b> QFinance hanya dapat diakses oleh Supervisor dan Director.
        </div>
        <button class="btn btn-primary" data-action="switch-app" data-app="dashboard">Kembali ke Dashboard</button>
      </div>
    `;
  }

  if (state.qfinLoading){
    return `
      <div class="greeting">QFinance 💰</div>
