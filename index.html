    `;
  }
  if (state.qfinError){
    return `
      <div class="greeting">QFinance 💰</div>
      <div class="greeting-sub">Gagal memuat data</div>
      <div class="card" style="background:var(--danger-soft); border-color:var(--danger-soft);">
        <div style="font-size:13px; color:var(--danger); margin-bottom:10px;"><b>⚠ Error:</b> ${escapeHTML(state.qfinError)}</div>
        <button class="btn btn-primary" data-action="qfin-refresh">🔄 Coba Lagi</button>
      </div>
    `;
  }
  const d = state.qfinData || {};
  if (!d.lastUpdated){
    return `<div class="empty-state"><span class="icon">💰</span><p>Data belum dimuat.</p><button class="btn btn-primary btn-block" style="margin-top:12px;" data-action="qfin-refresh">🔄 Muat Data</button></div>`;
  }

  const canOpenPortal = emp.role === 'owner' || (emp.dept === 'po' && emp.role === 'spv');
  const now = new Date();
  const tanggalStr = now.getDate() + ' ' + MONTHS[now.getMonth()] + ' ' + now.getFullYear();

  const expandKas = !!state.expanded['qfin-kas'];
  const expandBank = !!state.expanded['qfin-bank'];
  const expandHutang = !!state.expanded['qfin-hutang'];
  const expandPiutang = !!state.expanded['qfin-piutang'];
  const expandLaba = !!state.expanded['qfin-laba'];
  const expandStock = !!state.expanded['qfin-stock'];

  // Helper: render table rows from array (NO calculations, just display)
  function renderRows(rows, columns) {
    if (!rows || !rows.length) return '<div class="faint" style="font-size:12px; padding:8px;">Tidak ada data</div>';
    return '<div class="table-wrap" style="margin-top:10px; border:none; border-radius:8px;">' +
      '<table class="task-table" style="font-size:11.5px;">' +
      '<thead><tr>' + columns.map(c => '<th>' + c.label + '</th>').join('') + '</tr></thead>' +
      '<tbody>' +
      rows.map(row => '<tr>' + columns.map(c => 
        '<td style="padding:6px 8px; border-top:1px solid var(--line);">' + 
        (c.fn ? c.fn(row[c.key]) : escapeHTML(String(row[c.key] || '-'))) + 
        '</td>'
      ).join('') + '</tr>').join('') +
      '</tbody></table></div>';
  }

  // Helper: ambil daftar key bulan dari sebuah row (mis. kasRow/bankRow/
  // labaRugiRow), dalam urutan aslinya (= urutan kolom di sheet Neraca,
  // dari bulan paling awal ke paling akhir). "pos_akun" bukan bulan,
  // dibuang.
  function monthKeysOf(row) {
    if (!row) return [];
    return Object.keys(row).filter(k => k !== 'pos_akun');
  }
  // Helper: entri bulan PALING TERAKHIR yang tersedia di sebuah row.
  function latestMonthEntry(row) {
    const keys = monthKeysOf(row);
    if (!keys.length) return null;
    const lastKey = keys[keys.length - 1];
    return { month: lastKey, value: Number(row[lastKey]) || 0 };
  }

  // Chart garis sederhana (SVG murni, tanpa library) untuk Laba Rugi
  // Bulanan — dari bulan pertama sampai bulan terakhir yang ADA datanya
  // di sheet. Nilainya dipakai apa adanya dari backend, cuma digambar.
  // Chart 3-garis: Penjualan, Pengeluaran, Laba — semua bulanan (bukan
  // kumulatif), dihitung backend dari sheet GL. SVG murni, tanpa library.
  function renderPLChart(monthKeys, penjualanMap, pengeluaranMap, labaMap) {
    if (!monthKeys.length) return '<div class="faint" style="font-size:12px; padding:8px;">Tidak ada data</div>';
    const series = [
      { label: 'Penjualan', color: 'var(--success)', values: monthKeys.map(k => Number(penjualanMap[k]) || 0) },
      { label: 'Pengeluaran', color: 'var(--danger)', values: monthKeys.map(k => Number(pengeluaranMap[k]) || 0) },
      { label: 'Laba/Rugi', color: 'var(--ink)', dashed: true, values: monthKeys.map(k => Number(labaMap[k]) || 0) },
    ];
    const w = 640, h = 220, padL = 8, padR = 8, padT = 14, padB = 26;
    const innerW = w - padL - padR, innerH = h - padT - padB;
    const allVals = series.flatMap(s => s.values);
    let minV = Math.min(0, ...allVals), maxV = Math.max(0, ...allVals);
    if (minV === maxV) { minV -= 1; maxV += 1; }
    const range = maxV - minV;
    const xStep = monthKeys.length > 1 ? innerW / (monthKeys.length - 1) : 0;
    const xOf = i => padL + i * xStep;
    const yOf = v => padT + innerH - ((v - minV) / range) * innerH;
    const zeroY = yOf(0);

    const linesSvg = series.map(s => {
      const pathD = s.values.map((v, i) => (i === 0 ? 'M' : 'L') + xOf(i).toFixed(1) + ',' + yOf(v).toFixed(1)).join(' ');
      const dots = s.values.map((v, i) =>
        '<circle cx="' + xOf(i).toFixed(1) + '" cy="' + yOf(v).toFixed(1) + '" r="3" fill="' + s.color + '" stroke="#fff" stroke-width="1"/>'
      ).join('');
      return '<path d="' + pathD + '" fill="none" stroke="' + s.color + '" stroke-width="2.2"' + (s.dashed ? ' stroke-dasharray="5,3"' : '') + '/>' + dots;
    }).join('');

    const labels = monthKeys.map((k, i) =>
      '<text x="' + xOf(i).toFixed(1) + '" y="' + (h - 8) + '" font-size="9.5" fill="var(--ink-faint)" text-anchor="middle">' + escapeHTML(String(k).split(' ')[0].slice(0, 3)) + '</text>'
    ).join('');

    const legend = series.map(s =>
      '<span style="display:inline-flex; align-items:center; gap:5px; margin-right:14px; font-size:11px; color:var(--ink-soft);">' +
      '<span style="width:16px; height:0; border-top:2.5px ' + (s.dashed ? 'dashed' : 'solid') + ' ' + s.color + '; display:inline-block;"></span>' +
      escapeHTML(s.label) + '</span>'
    ).join('');

    return `
      <div style="display:flex; flex-wrap:wrap; margin-top:10px;">${legend}</div>
      <svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto; display:block; margin-top:8px;">
        <line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${w - padR}" y2="${zeroY.toFixed(1)}" stroke="var(--line)" stroke-width="1" stroke-dasharray="3,3"/>
        ${linesSvg}
        ${labels}
      </svg>
    `;
  }

  // Analisa deskriptif mengikuti chart 3-garis: posisi bulan terakhir
  // (Penjualan/Pengeluaran/Laba + margin), perubahan vs bulan
  // sebelumnya, dan bulan dengan laba terbaik/terlemah. Semua angka
  // dari data yang sama yang dipakai chart, tidak ada hitungan baru.
  function labaRugiAnalysis(monthKeys, penjualanMap, pengeluaranMap, labaMap) {
    if (!monthKeys.length) return '';
    const latest = monthKeys[monthKeys.length - 1];
    const prevM = monthKeys.length > 1 ? monthKeys[monthKeys.length - 2] : null;
    const pLatest = Number(penjualanMap[latest]) || 0, eLatest = Number(pengeluaranMap[latest]) || 0, lLatest = Number(labaMap[latest]) || 0;
    const margin = pLatest > 0 ? (lLatest / pLatest * 100) : null;

    const posisi = lLatest >= 0 ? 'laba' : 'rugi';
    const parts = [];
    parts.push('Per <b>' + escapeHTML(latest) + '</b>: Penjualan ' + fmtRupiah(pLatest) + ', Pengeluaran ' + fmtRupiah(eLatest) + ', hasil <b style="color:' + (lLatest >= 0 ? 'var(--success)' : 'var(--danger)') + '">' + posisi + ' ' + fmtRupiah(Math.abs(lLatest)) + '</b>' + (margin !== null ? ' (margin ' + margin.toFixed(1) + '%)' : '') + '.');

    if (prevM) {
      const pPrev = Number(penjualanMap[prevM]) || 0, ePrev = Number(pengeluaranMap[prevM]) || 0;
      if (pPrev > 0) {
        const pDelta = (pLatest - pPrev) / pPrev * 100;
        parts.push('Penjualan ' + (pDelta >= 0 ? 'naik' : 'turun') + ' ' + Math.abs(pDelta).toFixed(0) + '% dibanding bulan lalu.');
      }
      if (ePrev > 0) {
        const eDelta = (eLatest - ePrev) / ePrev * 100;
        parts.push('Pengeluaran ' + (eDelta >= 0 ? 'naik' : 'turun') + ' ' + Math.abs(eDelta).toFixed(0) + '% dibanding bulan lalu.');
      }
    }

    if (monthKeys.length > 1) {
      const lVals = monthKeys.map(k => Number(labaMap[k]) || 0);
      let maxIdx = 0, minIdx = 0;
      lVals.forEach((v, i) => { if (v > lVals[maxIdx]) maxIdx = i; if (v < lVals[minIdx]) minIdx = i; });
      parts.push('Bulan dengan laba terbaik: <b>' + escapeHTML(monthKeys[maxIdx]) + '</b> (' + fmtRupiah(lVals[maxIdx]) + '), terlemah: <b>' + escapeHTML(monthKeys[minIdx]) + '</b> (' + fmtRupiah(lVals[minIdx]) + ').');
    }
    return '<p style="font-size:12.5px; line-height:1.65; color:var(--ink-soft); margin-top:12px; padding-top:12px; border-top:1px solid var(--line);">' + parts.join(' ') + '</p>';
  }

  // Chart Target Bulanan: bar Revenue per bulan + garis putus-putus Target
  // (satu angka tetap, dari (rata-rata pengeluaran + rata-rata hutang) x 1.3)
  function renderTargetChart(monthKeys, penjualanMap, targetValue) {
    if (!monthKeys.length) return '<div class="faint" style="font-size:12px; padding:8px;">Tidak ada data</div>';
    const values = monthKeys.map(k => Number(penjualanMap[k]) || 0);
    const w = 640, h = 220, padL = 8, padR = 8, padT = 14, padB = 26;
    const innerW = w - padL - padR, innerH = h - padT - padB;
    const allVals = values.concat([targetValue, 0]);
    const maxV = Math.max(...allVals);
    const minV = Math.min(0, ...allVals);
    const range = (maxV - minV) || 1;
    const xStep = innerW / monthKeys.length;
    const barW = xStep * 0.55;
    const yOf = v => padT + innerH - ((v - minV) / range) * innerH;
    const zeroY = yOf(0);
    const targetY = yOf(targetValue);

    const bars = values.map((v, i) => {
      const x = padL + i * xStep + (xStep - barW) / 2;
      const y = yOf(Math.max(v, 0));
      const barH = Math.abs(yOf(v) - zeroY);
      const achieved = v >= targetValue;
      return '<rect x="' + x.toFixed(1) + '" y="' + Math.min(y, zeroY).toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + Math.max(barH, 1).toFixed(1) + '" fill="' + (achieved ? 'var(--success)' : 'var(--accent-soft)') + '" rx="2"/>';
    }).join('');

    const labels = monthKeys.map((k, i) =>
      '<text x="' + (padL + i * xStep + xStep / 2).toFixed(1) + '" y="' + (h - 8) + '" font-size="9.5" fill="var(--ink-faint)" text-anchor="middle">' + escapeHTML(String(k).split(' ')[0].slice(0, 3)) + '</text>'
    ).join('');

    return `
      <div style="display:flex; flex-wrap:wrap; gap:14px; margin-top:10px; font-size:11px; color:var(--ink-soft);">
        <span style="display:inline-flex; align-items:center; gap:5px;"><span style="width:10px; height:10px; background:var(--success); display:inline-block; border-radius:2px;"></span>Revenue (tercapai target)</span>
        <span style="display:inline-flex; align-items:center; gap:5px;"><span style="width:10px; height:10px; background:var(--accent-soft); display:inline-block; border-radius:2px;"></span>Revenue (belum tercapai)</span>
        <span style="display:inline-flex; align-items:center; gap:5px;"><span style="width:16px; height:0; border-top:2px dashed var(--danger); display:inline-block;"></span>Target</span>
      </div>
      <svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto; display:block; margin-top:8px;">
        <line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${w - padR}" y2="${zeroY.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
        ${bars}
        <line x1="${padL}" y1="${targetY.toFixed(1)}" x2="${w - padR}" y2="${targetY.toFixed(1)}" stroke="var(--danger)" stroke-width="1.5" stroke-dasharray="6,4"/>
        ${labels}
      </svg>
    `;
  }

  function renderTargetTable(monthKeys, penjualanMap, targetValue) {
    if (!monthKeys.length) return '<div class="faint" style="font-size:12px; padding:8px;">Tidak ada data</div>';
    return '<div class="table-wrap" style="margin-top:12px; border:none; border-radius:8px;">' +
      '<table class="task-table" style="font-size:11.5px;">' +
      '<thead><tr><th>Bulan</th><th>Revenue</th><th>Target</th><th>Gap</th><th>Status</th></tr></thead>' +
      '<tbody>' +
      monthKeys.map(k => {
        const v = Number(penjualanMap[k]) || 0;
        const gap = v - targetValue;
        const achieved = gap >= 0;
        return '<tr>' +
          '<td style="padding:6px 8px; border-top:1px solid var(--line); font-weight:600;">' + escapeHTML(k) + '</td>' +
          '<td style="padding:6px 8px; border-top:1px solid var(--line); font-family:var(--font-mono);">' + fmtRupiah(v) + '</td>' +
          '<td style="padding:6px 8px; border-top:1px solid var(--line); font-family:var(--font-mono); color:var(--ink-faint);">' + fmtRupiah(targetValue) + '</td>' +
          '<td style="padding:6px 8px; border-top:1px solid var(--line); font-family:var(--font-mono); color:' + (achieved ? 'var(--success)' : 'var(--danger)') + ';">' + (achieved ? '+' : '') + fmtRupiah(gap) + '</td>' +
          '<td style="padding:6px 8px; border-top:1px solid var(--line);"><span style="font-size:10.5px; padding:2px 8px; border-radius:99px; background:' + (achieved ? 'var(--success-soft)' : 'var(--danger-soft)') + '; color:' + (achieved ? 'var(--success)' : 'var(--danger)') + '; font-weight:600;">' + (achieved ? 'Tercapai' : 'Belum') + '</span></td>' +
          '</tr>';
      }).join('') +
      '</tbody></table></div>';
  }

  // Filter hutang/piutang by jenis (client-side filter, NOT calculation)
  const hutangRows = (d.hutangPiutangRows || []).filter(r => String(r.jenis || '').toLowerCase().includes('hutang'));
  const piutangRows = (d.hutangPiutangRows || []).filter(r => String(r.jenis || '').toLowerCase().includes('piutang'));

  // Filter Stock: dropdown per produk + toggle "hanya ada sisa" + pencarian
  // bebas (client-side filter, NOT calculation)
  const stockAll = d.stockKopiRows || [];
  const stockProdukOptions = [...new Set(stockAll.map(r => r.nama_produk).filter(Boolean))].sort();
  const stockSearchQuery = String(state.qfinStockSearch || '').trim().toLowerCase();
  const stockRows = stockAll.filter(r => {
    if (state.qfinStockFilterProduk !== 'all' && r.nama_produk !== state.qfinStockFilterProduk) return false;
    if (state.qfinStockOnlySisa && !(Number(r.sisa_kg) > 0)) return false;
    if (stockSearchQuery) {
      const haystack = [r.nama_produk, r.sku, r.batch_no].map(v => String(v || '').toLowerCase()).join(' ');
      if (!haystack.includes(stockSearchQuery)) return false;
    }
    return true;
  });

  const kasRow = d.kasRow || null;
  const bankRow = d.bankRow || null;
  const labaRugi = d.labaRugiRow || {};
  const plMonthKeys = monthKeysOf(d.penjualanBulanan || {});
  const latestKas = latestMonthEntry(kasRow);
  const latestBank = latestMonthEntry(bankRow);

  const piutangPerSalesRaw = d.piutangPerSales || { available: false, salesList: [], grandTotal: 0 };
  // BARU (2026-08-20): sales/customer dengan piutang Rp 0 tidak perlu
  // ditampilkan. Filter diterapkan di level CUSTOMER (c.total -- sudah
  // terbukti akurat dari kasus Serenona Coffeatery sebelumnya), lalu sales
  // hanya dianggap "masih ada piutang" kalau SETELAH filter itu masih
  // tersisa minimal 1 customer -- BUKAN mengandalkan s.total secara
  // langsung, supaya aman walau ternyata angka level-sales juga pernah
  // tidak sinkron dengan children-nya (sama seperti kasus level-invoice).
  // Level INVOICE SENGAJA TIDAK ikut difilter di sini -- total 0 di level
  // itu SUDAH TERBUKTI seringkali data yang salah (Serenona: kedua invoice
  // tercatat Rp 0 padahal total customer-nya benar Rp 2.100.000), jadi
  // menyembunyikan invoice ber-total 0 berisiko menyembunyikan tagihan
  // yang sebenarnya masih harus dibayar.
  const piutangPerSales = {
    available: piutangPerSalesRaw.available,
    grandTotal: piutangPerSalesRaw.grandTotal,
    salesList: (piutangPerSalesRaw.salesList || [])
      .map(s => ({ ...s, customers: (s.customers || []).filter(c => Number(c.total) > 0) }))
      .filter(s => s.customers.length > 0)
  };

  const kasBankTabBody = `
    <div class="section-title">💰 Kas & Bank Saat Ini</div>
    <div class="card card-hero" style="margin-bottom:12px;">
      <div class="hero-row" style="align-items:stretch; flex-wrap:wrap; gap:20px;">
        <div style="flex:1; min-width:140px;">
          <div class="hero-label">💵 Cash on Hand · ${escapeHTML((latestKas && latestKas.month) || '-')}</div>
          <div class="hero-big">${latestKas ? fmtRupiah(latestKas.value) : '—'}</div>
        </div>
        <div style="flex:1; min-width:140px;">
          <div class="hero-label">🏦 Cash in Bank · ${escapeHTML((latestBank && latestBank.month) || '-')}</div>
          <div class="hero-big">${latestBank ? fmtRupiah(latestBank.value) : '—'}</div>
        </div>
      </div>
      <div class="muted" style="font-size:11px; margin-top:12px;">Baris '1.1 Kas' &amp; '1.2 Bank' · sheet Neraca</div>
    </div>

    <div class="section-title">📈 Penjualan, Pengeluaran &amp; Laba Bulanan</div>
    <div class="card" style="margin-bottom:12px;">
      <div style="display:flex; align-items:center; gap:8px;">
        <span style="font-size:18px;">📈</span>
        <div style="font-weight:600; font-size:14px;">Dihitung dari sheet GL (per bulan, bukan kumulatif)</div>
      </div>
      ${renderPLChart(plMonthKeys, d.penjualanBulanan || {}, d.pengeluaranBulanan || {}, d.labaBulanan || {})}
      ${labaRugiAnalysis(plMonthKeys, d.penjualanBulanan || {}, d.pengeluaranBulanan || {}, d.labaBulanan || {})}
    </div>

    <div class="section-title">📊 Analisis Perubahan Revenue Bulanan</div>
    <div class="card" style="margin-bottom:12px;">
      <div class="faint" style="font-size:11px; margin-bottom:10px;">
        Untuk tiap bulan, customer mana yang paling besar kontribusinya terhadap naik/turunnya revenue dibanding bulan sebelumnya -- dihitung langsung dari data GL yang sama dengan grafik di atas (bukan tebakan, tapi juga bukan alasan bisnis di balik keputusan customer -- itu di luar apa yang bisa diketahui dari data transaksi).
      </div>
      ${(d.revenueAnalysis || []).length === 0 ? `
        <div class="faint" style="font-size:12px;">Belum cukup data (minimal 2 bulan) untuk analisis perubahan.</div>
      ` : (d.revenueAnalysis || []).slice().reverse().map(a => {
        const key = 'qfin-revenue-analysis-' + a.month;
        const isOpen = !!state.expanded[key];
        const isUp = a.direction === 'naik';
        const color = isUp ? 'var(--success)' : (a.direction === 'turun' ? 'var(--danger)' : 'var(--ink-faint)');
        const arrow = isUp ? '▲' : (a.direction === 'turun' ? '▼' : '—');
        const isDramatic = a.pctChange !== null && Math.abs(a.pctChange) >= 25;
        return `
          <div style="border-bottom:1px solid var(--line); padding:8px 0; ${isDramatic ? 'background:' + (isUp ? 'var(--success-soft, #E8F5E9)' : 'var(--danger-soft)') + '; border-radius:8px; padding-left:8px; padding-right:8px;' : ''}">
            <div style="display:flex; justify-content:space-between; align-items:center; cursor:pointer;" data-action="toggle-qfin" data-key="${escapeHTML(key)}">
              <div style="display:flex; align-items:center; gap:8px;">
                <span class="chev" style="color:var(--ink-faint); font-size:11px;">${isOpen ? '⌃' : '⌄'}</span>
                <div style="font-weight:600; font-size:12.5px;">${escapeHTML(a.month)}</div>
                ${isDramatic ? `<span class="faint" style="font-size:9.5px; text-transform:uppercase; letter-spacing:.03em;">${isUp ? 'lonjakan' : 'anjlok'}</span>` : ''}
              </div>
              <div style="text-align:right;">
                <div style="font-weight:700; font-size:13px; color:${color};">${arrow} ${fmtRupiah(Math.abs(a.delta))}</div>
                ${a.pctChange !== null ? `<div class="faint" style="font-size:10px;">${a.pctChange > 0 ? '+' : ''}${a.pctChange.toFixed(1)}%</div>` : `<div class="faint" style="font-size:10px;">bulan sebelumnya Rp0</div>`}
              </div>
            </div>
            ${isOpen ? `
              <div style="margin-top:8px; margin-left:19px;">
                <div class="faint" style="font-size:10.5px; margin-bottom:6px;">${fmtRupiah(a.prevVal)} → ${fmtRupiah(a.thisVal)}</div>
                ${a.topContributors.length === 0 ? `
                  <div class="faint" style="font-size:11px;">Tidak ada perubahan signifikan di level customer.</div>
                ` : a.topContributors.map(c => {
                  const typeLabel = { baru: '🆕 Customer baru', berhenti: '🚫 Berhenti beli bulan ini', naik: '📈 Pembelian naik', turun: '📉 Pembelian turun' }[c.type] || c.type;
                  const cColor = c.delta > 0 ? 'var(--success)' : 'var(--danger)';
                  return `
                    <div style="padding:5px 0; border-top:1px dashed var(--line); display:flex; justify-content:space-between; align-items:flex-start; gap:8px; font-size:11.5px;">
                      <div style="min-width:0;">
                        <div style="font-weight:600;">${escapeHTML(c.customer)}</div>
                        <div class="faint" style="font-size:10px;">${typeLabel} · ${fmtRupiah(c.prevMonthTotal)} → ${fmtRupiah(c.thisMonthTotal)}</div>
                      </div>
                      <div style="text-align:right; color:${cColor}; font-weight:700; white-space:nowrap;">${c.delta > 0 ? '+' : ''}${fmtRupiah(c.delta)}</div>
                    </div>
                  `;
                }).join('')}
              </div>
            ` : ''}
          </div>
        `;
      }).join('')}
    </div>

    ${(d.targetBulanan && (state.currentUser === 'owner' || state.currentUser === 'rizky')) ? `
    <div class="section-title">🎯 Target Bulanan (Marketing &amp; Sales)</div>
    <div class="card card-hero" style="margin-bottom:12px;">
      <div class="hero-label">Target / bulan</div>
      <div class="hero-big">${fmtRupiah(d.targetBulanan.target)}</div>
      <div class="muted" style="font-size:11px; margin-top:8px;">
        (Rata-rata pengeluaran ${fmtRupiah(d.targetBulanan.rataRataPengeluaran)} + rata-rata hutang ${fmtRupiah(d.targetBulanan.rataRataHutang)}) × 1.3
      </div>
      <div class="muted" style="font-size:10.5px; margin-top:4px;">
        Total hutang saat ini ${fmtRupiah(d.targetBulanan.totalHutang)} ÷ ${d.targetBulanan.jumlahBulan} bulan berjalan
      </div>
    </div>
    <div class="card" style="margin-bottom:12px;">
      ${renderTargetChart(plMonthKeys, d.penjualanBulanan || {}, d.targetBulanan.target)}
      ${renderTargetTable(plMonthKeys, d.penjualanBulanan || {}, d.targetBulanan.target)}
    </div>
    ` : ''}
  `;

  const hutangPiutangTabBody = `
    <div class="section-title">📋 Hutang Usaha</div>
    <div class="card" style="margin-bottom:12px;">
      <div style="display:flex; justify-content:space-between; align-items:center; cursor:pointer; padding:4px 0;" data-action="toggle-qfin" data-key="qfin-hutang">
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="font-size:18px;">📤</span>
          <div style="font-weight:600; font-size:14px;">Data Hutang (sheet Hutang_Piutang)</div>
        </div>
        <span class="chev" style="color:var(--ink-faint); font-size:12px;">${expandHutang ? '⌃' : '⌄'}</span>
      </div>
      ${expandHutang ? renderRows(hutangRows, [
        {label:'Jenis', key:'jenis'},
        {label:'Pihak', key:'nama_pihak'},
        {label:'Rincian', key:'rincian'},
        {label:'Jumlah', key:'jumlah_rincian', fn: v => fmtRupiah(v)},
        {label:'Saldo', key:'saldo_pihak', fn: v => fmtRupiah(v)}
      ]) : ''}
    </div>

    <div class="section-title">📋 Piutang Usaha</div>
    <div class="card" style="margin-bottom:12px;">
      <div style="display:flex; justify-content:space-between; align-items:center; cursor:pointer; padding:4px 0;" data-action="toggle-qfin" data-key="qfin-piutang">
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="font-size:18px;">📥</span>
          <div style="font-weight:600; font-size:14px;">Data Piutang (sheet Hutang_Piutang)</div>
        </div>
        <span class="chev" style="color:var(--ink-faint); font-size:12px;">${expandPiutang ? '⌃' : '⌄'}</span>
      </div>
      ${expandPiutang ? renderRows(piutangRows, [
        {label:'Jenis', key:'jenis'},
        {label:'Pihak', key:'nama_pihak'},
        {label:'Rincian', key:'rincian'},
        {label:'Jumlah', key:'jumlah_rincian', fn: v => fmtRupiah(v)},
        {label:'Saldo', key:'saldo_pihak', fn: v => fmtRupiah(v)}
      ]) : ''}
    </div>

    <div class="section-title">🧑‍💼 Piutang Per Sales</div>
    <div class="card" style="margin-bottom:12px;">
      ${!piutangPerSales.available ? `
        <div class="faint" style="font-size:12px;">Sheet Hutang_Piutang tidak ditemukan.</div>
      ` : piutangPerSalesRaw.salesList.length === 0 ? `
        <div class="faint" style="font-size:12px;">Blok "PIUTANG PER SALES" belum ditemukan di sheet -- pastikan kolom A berisi persis teks itu untuk seluruh baris bloknya.</div>
      ` : piutangPerSales.salesList.length === 0 ? `
        <div class="faint" style="font-size:12px;">✅ Semua piutang sudah lunas -- tidak ada sales/customer dengan saldo outstanding saat ini.</div>
      ` : `
        <div class="row between" style="margin-bottom:10px; padding-bottom:10px; border-bottom:1px solid var(--line);">
          <div style="font-weight:600; font-size:13px;">Total Piutang (semua sales)</div>
          <div style="font-weight:800; font-size:15px; color:var(--danger);">${fmtRupiah(piutangPerSales.grandTotal)}</div>
        </div>
        ${piutangPerSales.salesList.map(s => {
          const key = 'qfin-piutang-sales-' + s.salesName;
          const isOpen = !!state.expanded[key];
          return `
          <div style="border-bottom:1px solid var(--line); padding:8px 0;">
            <div style="display:flex; justify-content:space-between; align-items:center; cursor:pointer;" data-action="toggle-qfin" data-key="${escapeHTML(key)}">
              <div style="display:flex; align-items:center; gap:8px;">
                <span class="chev" style="color:var(--ink-faint); font-size:11px;">${isOpen ? '⌃' : '⌄'}</span>
                <div style="font-weight:600; font-size:12.5px;">${escapeHTML(s.salesName)}</div>
                <span class="faint" style="font-size:10.5px;">(${s.customers.length} customer)</span>
              </div>
              <div style="font-weight:700; font-size:13px;">${fmtRupiah(s.total)}</div>
            </div>
            ${isOpen ? `
              <div style="margin-top:8px; margin-left:19px;">
                ${s.customers.map(c => `
                  <div style="padding:6px 0; border-top:1px dashed var(--line);">
                    <div style="display:flex; justify-content:space-between; align-items:center; font-size:12px;">
                      <div>${escapeHTML(c.customerName)}</div>
                      <div style="display:flex; align-items:center; gap:8px;">
                        <div style="font-weight:600;">${fmtRupiah(c.total)}</div>
                        <button class="btn btn-ghost btn-sm" data-action="download-rekap-piutang" data-customer="${escapeHTML(c.customerName)}" style="padding:3px 8px; font-size:10.5px;" ${state.rekapPiutangLoading === c.customerName ? 'disabled' : ''}>
                          ${state.rekapPiutangLoading === c.customerName ? '⏳' : '📄 PDF'}
                        </button>
                        <button class="btn btn-ghost btn-sm" data-action="send-piutang-reminder" data-customer="${escapeHTML(c.customerName)}" style="padding:3px 8px; font-size:10.5px;" ${state.piutangReminderLoading === c.customerName ? 'disabled' : ''} title="Kirim reminder ke dashboard sales -- HANYA jika ada invoice yang sudah jatuh tempo">
                          ${state.piutangReminderLoading === c.customerName ? '⏳' : '⏰ Reminder'}
                        </button>
                      </div>
                    </div>
                    ${c.invoices.length ? `
                      <div style="margin-top:4px; margin-left:12px;">
                        ${c.invoices.map(inv => `
                          <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--ink-faint); padding:2px 0;">
                            <div>${escapeHTML(inv.ref)}</div>
                            <div>${inv.total > 0 ? fmtRupiah(inv.total) : '-'}</div>
                          </div>
                        `).join('')}
                      </div>
                    ` : ''}
                  </div>
                `).join('')}
              </div>
            ` : ''}
          </div>
        `; }).join('')}
      `}
      <div class="muted" style="font-size:10.5px; margin-top:10px;">Blok mengambang "PIUTANG PER SALES" di sheet Hutang_Piutang -- dibaca lewat penanda kolom, bukan posisi baris tetap, jadi tetap akurat walau baris bergeser.</div>
    </div>
  `;

  const stockDiag = d.stockDiag || { sheetFound: false, totalRowsInSheet: 0, expectedColumnsMissing: [], headerColumnsFound: [] };

  const stockTabBody = `
    <div class="section-title">☕ Stock Produk</div>
    ${!stockDiag.sheetFound ? `
    <div class="card" style="background:var(--danger-soft); margin-bottom:12px;">
      <div style="font-size:12.5px; color:var(--danger);"><b>⚠ Sheet "Stock" tidak ditemukan sama sekali di spreadsheet.</b></div>
    </div>
    ` : stockDiag.expectedColumnsMissing.length > 0 ? `
    <div class="card" style="background:#FFF3E0; margin-bottom:12px;">
      <div style="font-size:12.5px; color:#E65100;">
        <b>⚠ Sheet "Stock" ditemukan (${stockDiag.totalRowsInSheet} baris), tapi kolom berikut yang diharapkan TIDAK ADA di header:</b>
        <div style="margin-top:6px;">${stockDiag.expectedColumnsMissing.map(c => `<span style="display:inline-block; background:#fff; border:1px solid #E65100; border-radius:99px; padding:1px 8px; margin:2px 4px 0 0; font-size:11px;">${escapeHTML(c)}</span>`).join('')}</div>
        <div style="margin-top:6px;">Kolom yang benar-benar ada: ${stockDiag.headerColumnsFound.map(c => escapeHTML(c)).join(', ')}</div>
      </div>
    </div>
    ` : ''}
    <div class="card" style="margin-bottom:12px;">
      <div style="display:flex; justify-content:space-between; align-items:center; cursor:pointer; padding:4px 0;" data-action="toggle-qfin" data-key="qfin-stock">
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="font-size:18px;">☕</span>
          <div style="font-weight:600; font-size:14px;">Stock Produk (sheet Stock) · ${stockRows.length}/${stockAll.length} baris</div>
        </div>
        <span class="chev" style="color:var(--ink-faint); font-size:12px;">${expandStock ? '⌃' : '⌄'}</span>
      </div>
      ${expandStock ? `
      <div style="display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:10px; padding-top:10px; border-top:1px solid var(--line);" onclick="event.stopPropagation()">
        <input type="text" class="inline-input" data-action="set-qfin-stock-search" placeholder="🔍 Cari produk, SKU, atau batch..." value="${escapeHTML(state.qfinStockSearch || '')}" style="flex:1; min-width:180px; max-width:260px;">
        <select class="inline-select" data-action="set-qfin-stock-produk" style="max-width:220px;">
          <option value="all" ${state.qfinStockFilterProduk==='all'?'selected':''}>Semua Produk (${stockProdukOptions.length})</option>
          ${stockProdukOptions.map(p => `<option value="${escapeHTML(p)}" ${state.qfinStockFilterProduk===p?'selected':''}>${escapeHTML(p)}</option>`).join('')}
        </select>
        <label style="display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-soft); cursor:pointer;">
          <input type="checkbox" data-action="toggle-qfin-stock-sisa" ${state.qfinStockOnlySisa ? 'checked' : ''} style="cursor:pointer;">
          Hanya yang masih ada sisa
        </label>
      </div>
      ` : ''}
      ${expandStock ? renderRows(stockRows, [
        {label:'Produk', key:'nama_produk'},
        {label:'SKU', key:'sku'},
        {label:'Batch', key:'batch_no'},
        {label:'Tanggal', key:'tanggal'},
        {label:'Produksi Awal (kg)', key:'produksi_awal_kg'},
        {label:'Sisa (kg)', key:'sisa_kg'},
        {label:'Status', key:'status', fn: v => `<span style="font-size:10.5px; padding:2px 8px; border-radius:99px; background:${v==='Tersedia'?'var(--success-soft, #E8F5E9)':'var(--line)'}; color:${v==='Tersedia'?'var(--success)':'var(--ink-faint)'}; font-weight:600;">${escapeHTML(v)}</span>`}
      ]) : ''}
    </div>
  `;

  const tabBody = state.qfinTab === 'hutangpiutang' ? hutangPiutangTabBody
    : state.qfinTab === 'stock' ? stockTabBody
    : kasBankTabBody;

  return `
    <div class="greeting">QFinance 💰</div>
    <div class="greeting-sub">Posisi Keuangan · ${tanggalStr} <span class="faint">(live dari sheet)</span></div>

    ${canOpenPortal ? `
    <div class="app-grid" style="grid-template-columns:1fr; margin-bottom:16px;">
      <div class="app-card" onclick="openPortalWithToken('qfin', CONFIG.QFIN_PORTAL_URL)">
        <div class="app-icon qfin">💰</div>
        <div class="app-info">
          <div class="app-name">Buka Portal QFinance</div>
          <div class="app-desc">GL lengkap, Neraca, Rugi Laba, HPP, Inventory, Kas &amp; Bank, AR/AP</div>
          <span class="app-status live">🟢 Live</span>
        </div>
      </div>
    </div>
    ` : `
    <div class="app-grid" style="grid-template-columns:1fr; margin-bottom:16px;">
      <div class="app-card" style="opacity:.6; cursor:default;">
        <div class="app-icon qfin">🔒</div>
        <div class="app-info">
          <div class="app-name">Portal QFinance</div>
          <div class="app-desc">Akses portal dibatasi. Hubungi Supervisor Ops &amp; Product Development atau Director.</div>
          <span class="app-status" style="background:var(--danger-soft); color:var(--danger);">🔒 Terkunci</span>
        </div>
      </div>
    </div>
    `}

    ${qfinSubNavHTML()}

    ${tabBody}

    <p class="hint" style="text-align:center; margin-top:8px;">
      Data live dari sheet Neraca, Hutang_Piutang, Stock · Terakhir dimuat ${d.lastUpdated ? new Date(d.lastUpdated).toLocaleTimeString('id-ID') : '-'}
    </p>
  `;
}

function crmDashboardHTML(){
  if (state.crmLoading){
    return `
      <div class="greeting">CRM 👥</div>
      <div class="empty-state"><span class="icon">👥</span><p>Memuat data dari sheet...</p></div>
    `;
  }
  if (state.crmError){
    return `
      <div class="greeting">CRM 👥</div>
      <div class="empty-state">
        <span class="icon">⚠️</span>
        <p>${escapeHTML(state.crmError)}</p>

      </div>
    `;
  }
  const d = state.crmData || {};
  if (!d.lastUpdated){
    return `
      <div class="greeting">CRM 👥</div>
      <div class="empty-state"><span class="icon">👥</span><p>Data belum dimuat.</p><button class="btn btn-primary btn-block" style="margin-top:12px;" data-action="crm-refresh">🔄 Muat Data</button></div>

  if (state.crmSelectedCustomer){
    return crmCustomerDetailHTML(d, state.crmSelectedCustomer);
  }

  const customers = d.customers || [];
  const logs = d.logs || [];

  const byCluster = {};
  CRM_CLUSTER_ORDER.forEach(c => byCluster[c] = []);
  customers.forEach(c => { if (byCluster[c.cluster]) byCluster[c.cluster].push(c); });
  Object.keys(byCluster).forEach(c => byCluster[c].sort((a,b) => b.curValue - a.curValue));

  const tasks = logs.filter(l => l.tipe === 'Tugas')
    .filter(l => state.crmTaskFilterStatus === 'all' || (l.status||'Pending') === state.crmTaskFilterStatus)

  const activities = logs.filter(l => l.tipe === 'Aktivitas')

  function crmCustomerRow(c){

          <div style="font-family:var(--font-mono); font-weight:600; font-size:12.5px;">${fmtRupiah(c.curValue)}</div>
          <div class="faint" style="font-size:10px;">${c.deltaPct !== null ? (c.deltaPct>=0?'▲ +':'▼ ') + c.deltaPct.toFixed(0) + '%' : (c.curValue>0 ? 'baru' : '-')}</div>
        </div>
      </div>
    `;
  }

  return `
    <div class="greeting">CRM 👥</div>
    <div class="greeting-sub">Existing client · membandingkan ${escapeHTML(d.curMonthLabel||d.curMonth||'-')} vs ${escapeHTML(d.prevMonthLabel||d.prevMonth||'-')} <span class="faint">(update tgl 15/bulan)</span></div>

    <div class="section-title">📌 Tugas &amp; Reminder Follow-up</div>
    <div class="card" style="margin-bottom:16px;">
      <select class="inline-select" data-action="set-crm-task-filter" style="margin-bottom:10px;">
        <option value="Pending" ${state.crmTaskFilterStatus==='Pending'?'selected':''}>Pending</option>
        <option value="Selesai" ${state.crmTaskFilterStatus==='Selesai'?'selected':''}>Selesai</option>
        <option value="all" ${state.crmTaskFilterStatus==='all'?'selected':''}>Semua</option>
      </select>
      ${tasks.length ? tasks.map(t => `
        <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 0; border-top:1px solid var(--line);">
          <div style="flex:1; min-width:0; cursor:pointer;" data-action="crm-open-customer" data-customer="${escapeHTML(t.customer)}">
            <div style="font-weight:600; font-size:13px;">${escapeHTML(t.judul)}</div>
            <div class="faint" style="font-size:11px;">👤 ${escapeHTML(t.customer)} · 📅 ${escapeHTML(t.tanggal)}</div>
          </div>

      `).join('') : '<div class="faint" style="font-size:12px; padding:8px;">Tidak ada tugas</div>'}
    </div>

    <div class="section-title">📝 Aktivitas Terbaru</div>
    <div class="card" style="margin-bottom:16px;">
      ${activities.length ? activities.map(a => `
        <div style="cursor:pointer; padding:8px 0; border-top:1px solid var(--line);" data-action="crm-open-customer" data-customer="${escapeHTML(a.customer)}">
          <div style="font-weight:600; font-size:13px;">${escapeHTML(a.judul)}</div>

// Template pesan WhatsApp per cluster CRM, sudah terisi data histori
// pembelian asli customer (nama, nilai order bulan ini/lalu, jumlah
// transaksi). Semua angka diambil dari data yang sudah ada, tidak ada
// hitungan baru.
function crmWaTemplateText_(cust, curLabel, prevLabel){
  const nama = cust.nama_customer;
  const curVal = fmtRupiah(cust.curValue);
  const prevVal = fmtRupiah(cust.prevValue);
  const curCount = cust.curCount;
  const pct = cust.deltaPct !== null ? Math.abs(cust.deltaPct).toFixed(0) + '%' : null;

  const templates = {
    'Meningkat': `Halo ${nama} 👋\n\nTerima kasih banyak sudah jadi pelanggan setia kami! Kami lihat order dari ${nama} di ${curLabel} naik jadi ${curVal}${pct ? ' (naik ' + pct + ')' : ''} dibanding ${prevLabel} yang ${prevVal} — senang banget bisa terus mendukung kebutuhan kopi Anda 🙏\n\nAda yang bisa kami bantu untuk order berikutnya?`,

    'Menurun': `Halo ${nama} 👋\n\nKami perhatikan order dari ${nama} di ${curLabel} turun jadi ${curVal}${pct ? ' (turun ' + pct + ')' : ''}, dari sebelumnya ${prevVal} di ${prevLabel}.\n\nSemoga semuanya baik-baik saja di sana. Ada kendala yang bisa kami bantu, atau ada masukan soal produk/pelayanan kami? Kami mau pastikan kebutuhan ${nama} tetap terpenuhi dengan baik 🙏`,

    'Stabil': `Halo ${nama} 👋\n\nTerima kasih terus percaya sama kami — order di ${curLabel} (${curVal}) konsisten seperti ${prevLabel}. Kami senang bisa jadi partner kopi yang reliable buat ${nama}.\n\nAda yang bisa kami bantu untuk kebutuhan berikutnya?`,

    'Customer Baru': `Halo ${nama} 👋\n\nTerima kasih banyak sudah order pertama kali di ${curLabel} (${curVal}${curCount > 1 ? ', ' + curCount + ' transaksi' : ''})! Senang banget bisa mulai kerja sama dengan ${nama} 🎉\n\nKalau ada pertanyaan soal produk atau butuh bantuan apa pun, jangan ragu hubungi kami ya. Semoga kopi kami cocok buat kebutuhan Anda!`,

    'Tidak Ada Order Bulan Ini': `Halo ${nama} 👋\n\nKami perhatikan belum ada order dari ${nama} di ${curLabel}, padahal ${prevLabel} masih order ${prevVal}.\n\nSemoga semua baik-baik saja. Ada yang bisa kami bantu, atau mungkin ada kendala stok/pengiriman kemarin? Kami siap bantu kapan pun dibutuhkan 🙏`,

    'Tidak Ada Order': `Halo ${nama} 👋\n\nSudah lama nih kita nggak dengar kabar dari ${nama} 😊 Kami kangen bisa bantu kebutuhan kopi Anda lagi.\n\nKalau ada waktu, boleh kabari kami kalau butuh restock atau ada perubahan kebutuhan? Kami siap bantu kapan saja!`
  };
  return templates[cust.cluster] || `Halo ${nama} 👋\n\n`;
}

/* ---------- Dashboard ---------- */
async function fetchWabotStats(){
  if (state.wabotStatsLoading) return;
  state.wabotStatsLoading = true;
  state.wabotStatsFetched = true;
  render();
  // BARU (2026-08-03): auto-retry SEKALI di sisi browser kalau percobaan
  // pertama gagal (timeout/error) -- sebelumnya user harus KLIK REFRESH
  // MANUAL kalau ini terjadi. Sekarang dicoba ulang otomatis SEKALI dulu,
  // diam-diam (tidak tampilkan error di percobaan pertama), baru kalau
  // KEDUANYA gagal baru user diberi tahu.
  let res = null, lastErr = null;
  for (let attempt = 1; attempt <= 2; attempt++) {
    try {
      res = await wabotCall('getStats', {});
      if (res && res.success) break;
      lastErr = res && res.error;
    } catch(e) {
      lastErr = e;
      res = null;
    }
  }
  if (res && res.success) {
    state.wabotStats = res.stats || {};
    state.wabotVersionInfo = { waBotVersion: res.waBotVersion || '-', mainGasVersion: res.mainGasVersion || '-', qsystemGasVersion: '(memuat…)' };
  } else {
    showToast('WA Bot: ' + (lastErr || 'Gagal memuat statistik setelah 2 percobaan'));
  }
  state.wabotStatsLoading = false;
  render();
  // BARU (2026-08-03): versi QSystem diambil LANGSUNG ke QSystem sendiri --
  // BUKAN lewat wabot_proxy/WA-Bot.gs (yang sebelumnya bikin putaran sirkuler

/* ---------- Ambil Alih Percakapan ---------- */
function wabotExtractMessageText_(msg){
  if (typeof msg.content === 'string') return msg.content;
  if (!Array.isArray(msg.content)) return '(kosong)';
  return msg.content.map(block => {
    if (block.type === 'text') return block.text;
    if (block.type === 'tool_use') return '[memanggil: ' + block.name + ']';
    if (block.type === 'tool_result') return '[hasil sistem: ' + String(block.content).substring(0,80) + '...]';
    return '';
  }).filter(Boolean).join(' ') || '(kosong)';
}

function wabotTakeoverHTML(){
  if (!state.wabotEscalatedFetched && !state.wabotEscalatedLoading) { fetchWabotEscalated(); }

  // di claudeMessages -- pilih yang mana ada isinya (conversationKind='crm'
  // yang jadi penentu utama, fallback ke cek array kalau field itu kosong).
  const wabotMsgsFor = (session) => {
    if (!session) return [];
    if (session.conversationKind === 'crm') return session.crmMessages || [];
    if (session.crmMessages && session.crmMessages.length) return session.crmMessages;
    return session.claudeMessages || [];

  const wabotIsCrm = (session) => !!(session && (session.conversationKind === 'crm' || (session.crmMessages && session.crmMessages.length)));

  return `

        list.map(c => {
          const isCrm = wabotIsCrm(c.session);
          const msgs = wabotMsgsFor(c.session);
          const lastMsg = msgs.length ? wabotExtractMessageText_(msgs[msgs.length-1]) : '(belum ada pesan)';
          const since = c.session && c.session.takeoverSince ? new Date(c.session.takeoverSince).toLocaleString('id-ID') : '-';

          return `
            <div style="padding:10px 12px; border:1px solid ${isActive?'var(--accent)':'var(--line)'}; background:${isActive?'var(--accent-soft)':'transparent'}; border-radius:8px; margin-bottom:6px; cursor:pointer;" data-action="wabot-open-escalated" data-phone="${escapeHTML(c.phone)}">

                  <strong style="font-size:13px;">${escapeHTML(c.phone)}</strong>

              <div class="faint" style="font-size:11.5px; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHTML(lastMsg)}</div>

/* ============================================================
   FIX MENYELURUH: cursor/isi textarea & input hilang saat render() dipicu
   di tengah user mengetik (mis. oleh polling background) -- BUKAN cuma di
   satu tempat, tapi masalah SISTEMIK karena app ini re-render SELURUH
   innerHTML pada SETIAP perubahan state. Dua helper generik ini dipakai di
   render() DAN renderModal() supaya melindungi SEMUA textarea/input teks di
   SELURUH situs sekaligus, bukan ditambal satu per satu.
   ============================================================ */
function captureFocusedTextInput_(){
  const active = document.activeElement;
  if (!active) return null;
  const isTextInput = active.tagName === 'TEXTAREA' ||
    (active.tagName === 'INPUT' && ['text','search','tel','email','number','password','url'].includes(active.type));
  if (!isTextInput) return null;
  if (!active.id && !active.name) return null; // tidak bisa ditemukan lagi setelah render tanpa id/name
  return {
    id: active.id || null,
    name: active.name || null,
    value: active.value,
    selectionStart: active.selectionStart,
    selectionEnd: active.selectionEnd,
  };
}
function restoreFocusedTextInput_(saved){
  if (!saved) return;
  let el = null;
  if (saved.id) el = document.getElementById(saved.id);
  if (!el && saved.name) el = document.querySelector(`[name="${CSS.escape(saved.name)}"]`);
  if (!el || (el.tagName !== 'TEXTAREA' && el.tagName !== 'INPUT')) return;
  if (el.value !== saved.value) el.value = saved.value; // pulihkan draft yang belum tersimpan ke state
  el.focus();
  try {
    if (typeof saved.selectionStart === 'number') el.setSelectionRange(saved.selectionStart, saved.selectionEnd);
  } catch(e) { /* sebagian tipe input tidak dukung setSelectionRange -- aman diabaikan */ }
}

function renderModal(){
  const __savedFocus = captureFocusedTextInput_();

  // QSystem main modal
  const existing = document.getElementById('qsystem-modal-overlay');
  if (existing) existing.remove();
  if (state.modal.open) {
    const html = modalHTML();
    if (html) {
      const wrapper = document.createElement('div');
      wrapper.innerHTML = html;
      const overlay = wrapper.firstElementChild;
      overlay.id = 'qsystem-modal-overlay';
      document.body.appendChild(overlay);
    }
  }

  // Management Notes modal
  const existingMN = document.getElementById('mn-modal-overlay');
  if (existingMN) existingMN.remove();
  if (state.mnModalOpen) {
    const mnHtml = mnModalHTML();
    if (mnHtml) {
      const mnWrapper = document.createElement('div');
      mnWrapper.innerHTML = mnHtml;
      const mnOverlay = mnWrapper.firstElementChild;
      mnOverlay.id = 'mn-modal-overlay';
      document.body.appendChild(mnOverlay);
    }
  }

  restoreFocusedTextInput_(__savedFocus);
}

/* ============================================================
   RENDER — Utama
   ============================================================ */
function render(){
  const __savedFocus = captureFocusedTextInput_();
  const app = document.getElementById('app');
  if (!state.currentUser){
    // BARU (2026-08-05, FIX BUG): dropdown "Pilih nama" (login-select) adalah
    // elemen HTML biasa -- pilihannya HANYA hidup di DOM, tidak pernah masuk
    // ke state. captureFocusedTextInput_ di atas cuma melindungi TEXTAREA/
    // INPUT teks yang SEDANG FOKUS (mis. field PIN), BUKAN dropdown ini --
    // jadi kalau render() terpicu ulang SAAT user sudah pilih nama tapi lagi
    // fokus mengetik PIN (misalnya karena fetch getData() di background baru
    // selesai, lihat init()), dropdown-nya BALIK KOSONG ("— Pilih nama —")
    // walau PIN yang sudah diketik tetap aman. Di sini nilai dropdown DAN
    // isi PIN disimpan SEBELUM render ulang, dipulihkan SESUDAHNYA -- beda
    // dari captureFocusedTextInput_ karena TIDAK PEDULI elemen mana yang lagi
    // fokus, cukup ambil isinya dari DOM lama sebelum dihancurkan.
    const oldSelect = document.getElementById('login-select');
    const oldPin = document.getElementById('login-pin');
    const savedLoginSelect = oldSelect ? oldSelect.value : null;
    const savedLoginPin = oldPin ? oldPin.value : null;

    app.innerHTML = loginScreenHTML();

    if (savedLoginSelect) {
      const newSelect = document.getElementById('login-select');
      if (newSelect) newSelect.value = savedLoginSelect;
    }
    if (savedLoginPin) {
      const newPin = document.getElementById('login-pin');
      if (newPin) newPin.value = savedLoginPin;
    }
    restoreFocusedTextInput_(__savedFocus);
    return;
  }
  // Redirect ke dashboard jika user tidak punya akses ke tab saat ini
  if (!isAppAllowed(state.currentUser, state.appTab)) {
    state.appTab = 'dashboard';
  }
  let body = '';
  if (state.appTab === 'dashboard'){
    body = dashboardHTML();
  } else if (state.appTab === 'qtask'){
    body = qtaskSubNavHTML();
    if (state.qtaskTab==='home') body += qtaskHomeHTML();
    else if (state.qtaskTab==='tasks') body += qtaskTasksHTML();
    else if (state.qtaskTab==='team' && hasTeamView(state.currentUser)) body += qtaskTeamHTML();
    else if (state.qtaskTab==='report') body += qtaskReportHTML();
    else { state.qtaskTab='home'; body += qtaskHomeHTML(); }
  } else if (state.appTab === 'qfin'){
    body = qfinDashboardHTML();
  } else if (state.appTab === 'crm'){
    body = crmDashboardHTML();
  } else if (state.appTab === 'wabot'){
    body = wabotHTML();
  } else if (state.appTab === 'qsales'){
    if (state.qsalesTab === 'dashboard') body = qsalesDashboardHTML();
    else if (state.qsalesTab === 'leads') body = qsalesLeadsHTML();
    else if (state.qsalesTab === 'kpi') body = qsalesKPIHTML();
    else if (state.qsalesTab === 'kunjungan') body = qsalesKunjunganHTML();
    else { state.qsalesTab = 'dashboard'; body = qsalesDashboardHTML(); }
  } else if (state.appTab === 'qaff'){
    body = qaffDashboardHTML();
  } else if (state.appTab === 'content'){
    body = contentPlanHTML();
  } else if (state.appTab === 'settings'){
    body = qtaskSettingsHTML();
  } else {
    state.appTab = 'dashboard';
    body = dashboardHTML();
  }

  app.innerHTML = `
    ${sidebarHTML()}
    <div class="main-area">
      ${topBarHTML()}
      <main class="content">${body}</main>
      ${bottomNavHTML()}
    </div>
  `;
  renderModal();
  restoreFocusedTextInput_(__savedFocus);
}

document.addEventListener('click', function(e){
  const el = e.target.closest('[data-action]');
  if (!el) return;

  if (el.dataset.action === 'select-user'){
    selectUser(el.dataset.id);
  }
  else if (el.dataset.action === 'do-login'){
    const sel = document.getElementById('login-select');
    const pinInput = document.getElementById('login-pin');
    const empId = sel ? sel.value : '';
    const pin = pinInput ? pinInput.value.trim() : '';
    if (!empId) { showToast('Pilih nama dulu'); return; }
    if (!pin || pin.length !== 4 || !/^[0-9]{4}$/.test(pin)) { showToast('Masukkan PIN 4 digit angka'); return; }
    const emp = findEmp(empId);
    if (!emp) { showToast('Nama tidak ditemukan'); return; }
    // Validate PIN via GAS (sync across devices)
    showToast('Memverifikasi…');
    apiCall('validatePin', empId, pin).then(result => {
      if (result && result.valid) {
        // BARU (2026-08-13): catat absensi -- FIRE-AND-FORGET, SENGAJA tidak
        // di-await dan tidak boleh pernah mengganggu/menunda proses login
        // sama sekali (login sudah dioptimasi habis-habisan malam ini,
        // TIDAK BOLEH ada penambahan yang memperlambatnya). Kalau gagal,
        // diam saja -- tidak ditampilkan ke user, tidak menghalangi apa pun.
        apiCall('recordAttendance', { staffId: empId }).catch(()=>{});
        selectUser(empId);
      } else {
        showToast('PIN salah');
        pinInput.value = '';
        pinInput.focus();
      }
    }).catch(err => {
      showToast('Gagal memverifikasi: ' + (err.message || 'Cek koneksi & URL GAS'));
      console.error('validatePin error:', err);
      pinInput.value = '';
      pinInput.focus();
    });
  }
  else if (el.dataset.action === 'switch-app'){

        // Decode base64 -> Blob -> trigger download lewat elemen <a> sementara.
        const byteChars = atob(result.pdfBase64);
        const byteNumbers = new Array(byteChars.length);
        for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
        const blob = new Blob([new Uint8Array(byteNumbers)], { type: 'application/pdf' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = result.fileName || ('Rekap Piutang - ' + customerName + '.pdf');
        document.body.appendChild(a);

        URL.revokeObjectURL(url);

// BARU (2026-08-03, FIX BUG SERIUS): app ini re-render SELURUH innerHTML
// setiap ada perubahan state (mis. polling refreshData() tiap 30 detik) --
// textarea yang lagi diketik/paste user IKUT DIBANGUN ULANG dari state lama
// setiap render() itu terjadi, jadi draft yang belum disimpan HILANG/
// "kembali ke teks lama" (persis keluhan user: paste lalu balik lagi dengan
// cepat). Listener ini sinkronkan isi textarea ke state SETIAP ketikan/paste
// (TANPA memanggil render() -- itu justru boros & bisa bikin kursor
// lompat), supaya kalau render() lain terpicu di tengah proses, hasil
// render itu pakai draft TERBARU, bukan yang sudah basi.
document.addEventListener('input', function(e){

        showToast('Persona bot berhasil disimpan');

        showToast('Gagal menyimpan: ' + ((res && res.error) || 'coba lagi'));

      }
    }).catch(() => {

      showToast('Gagal menghubungi server');

  else if (e.target.id === 'form-mn'){

    const payload = { id: id, title: title, content: content, targetType: targetType, targetStaff: targetStaff, createdBy: state.currentUser, isActive: true };
    apiCall('saveManagementNote', payload).then(()=>{

/* ============================================================
   Init
   ============================================================ */
async function init(){
  // BARU (2026-08-04, FIX PERFORMA LOGIN): SEBELUMNYA render() PERTAMA KALI
  // baru dipanggil SETELAH DUA panggilan jaringan berurutan selesai --
  // testGASConnection() (cuma tes koneksi utk catatan console, TIDAK
  // menampilkan apa pun ke user) DAN apiCall('getData') (data sungguhan).
  // Itu artinya layar pilih-user/PIN LITERAL TIDAK BISA MUNCUL sampai
  // KEDUA request itu selesai -- padahal komentar lama di sini bilang
  // "PIN required every time, pre-load data in BACKGROUND", tapi kodenya
  // justru melakukan SEBALIKNYA (blocking, bukan background).
  //
  // testGASConnection() DIHAPUS dari sini seluruhnya -- fungsinya cuma
  // panggilan getData KEDUA yang terpisah, semata untuk console.log
  // diagnostik, sepenuhnya redundan dengan logging yang SUDAH otomatis ada
  // di apiCall/gsJSONP untuk request getData yang SUNGGUHAN di bawah ini.
  //
  // render() sekarang dipanggil SEGERA -- daftar user (EMPLOYEES hardcoded)
  // sudah tersedia tanpa perlu tunggu server sama sekali, jadi layar
  // pilih-user muncul INSTAN. Data dinamis dari getData() menyusul betul-
  // betul di belakang layar, render ulang begitu selesai.
  render();

  try {
    state.data = await apiCall('getData');
    state.syncStatus = 'synced';
    state.lastSyncedAt = Date.now();
  } catch(e){
    console.error('[QSystem] getData failed:', e);
    state.syncStatus = 'offline';
  }
  render();
}
init();

// Helper: get active employees (from GAS data or fallback)
function getEmployees(){
  // Merge hardcoded + dynamic, preserve qcoSystem from either source
  const dynamic = (state.data && state.data.employees && state.data.employees.length) ? state.data.employees : [];
  // BARU (2026-08-13, FIX BUG DROPDOWN LOGIN): SEBELUMNYA fungsi ini
  // mengembalikan urutan yang BERBEDA tergantung sumber datanya -- fallback
  // EMPLOYEES (urutan tetap sesuai array di kode) SEBELUM getData() selesai,
  // lalu urutan BARIS SHEET (bisa beda total) SETELAH getData() selesai dan
  // render ulang. User melaporkan dropdown login TERLIHAT BERUBAH URUTAN
  // (mis. "Owner" pindah dari bawah ke tengah) tepat di seputar momen ini.
  // Sekarang KEDUA jalur diurutkan SAMA PERSIS (alfabetis nama) supaya
  // dropdown TIDAK PERNAH terlihat berubah urutan sama sekali, dari fallback
  // maupun sesudah data live masuk.
  if (!dynamic.length) return [...EMPLOYEES].sort((a, b) => a.name.localeCompare(b.name));
  const merged = [];
  const seen = new Set();
  // Dynamic first (from GAS), preserve qcoSystem
  dynamic.forEach(d => {
    const hard = EMPLOYEES.find(e => e.id === d.id);
    merged.push({
      id: d.id || hard?.id || '',
      name: d.name || hard?.name || '',
      dept: d.dept || hard?.dept || 'sm',
      role: d.role || hard?.role || 'staff',
      jabatan: d.jabatan || hard?.jabatan || '',
      qcoSystem: d.qcoSystem || d.QcoSystem || hard?.qcoSystem || ''
    });
    seen.add(d.id);
  });
  // Add hardcoded yang belum ada di dynamic
  EMPLOYEES.forEach(e => {
    if (!seen.has(e.id)) merged.push(e);
  });
  merged.sort((a, b) => a.name.localeCompare(b.name));
  return merged;
}
function findEmpDynamic(id){ 
  return getEmployees().find(e=>e.id===id); 
}

/* ============================================================
   ROLE-BASED APP ACCESS
   ============================================================ */
function getAllowedApps(userId){
  const emp = findEmp(userId);
  if (!emp) return ['dashboard'];
  // Parse dari kolom QcoSystem (dari GAS atau hardcoded)
  const rules = String(emp.qcoSystem || '').trim();
  let allowed = ['dashboard'];
  if (!rules) {
    // Fallback: Spv & Owner = semua, staff = dashboard + qtask
    if (emp.role === 'spv' || emp.role === 'owner') {
      allowed = ['dashboard', 'qtask', 'qfin', 'qsales', 'qaff', 'crm', 'wabot'];
    } else {
      allowed = ['dashboard', 'qtask'];
    }
  } else if (rules.toLowerCase() === 'all') {
    allowed = ['dashboard', 'qtask', 'qfin', 'qsales', 'qaff', 'crm', 'wabot'];
  } else {
    // Parse string rules: "Hanya bisa membuka Dashboard, Task, Sales"
    const appMap = {
      'dashboard': 'dashboard',
      'task': 'qtask',
      'sales': 'qsales',
      'finance': 'qfin',
      'affiliator': 'qaff',
      'crm': 'crm',
      'customer': 'crm',
      'qtask': 'qtask',
      'qsales': 'qsales',
      'qfin': 'qfin',
      'qaff': 'qaff',
    };
    const lowerRules = rules.toLowerCase();
    Object.keys(appMap).forEach(key => {
      if (lowerRules.includes(key)) {
        if (!allowed.includes(appMap[key])) allowed.push(appMap[key]);
      }
    });
  }
  // RESTRICT QFIN & CRM Tab: Spv (semua dept) dan Owner bisa lihat tab
  // QFinance & CRM (data keuangan/customer sensitif). Razak (staff, po) =
  // asisten, tidak mendapat akses ini.
  if (allowed.includes('qfin')) {
    const canSeeQFinTab = emp.role === 'owner' || emp.role === 'spv';
    if (!canSeeQFinTab) {
      allowed = allowed.filter(a => a !== 'qfin');
    }
  }
  if (allowed.includes('qaff')) {
    // Sama seperti QFinance -- data komisi & payout affiliate sensitif,
    // Owner + semua Spv, bukan staff biasa.
    const canSeeQAffTab = emp.role === 'owner' || emp.role === 'spv';
    if (!canSeeQAffTab) {
      allowed = allowed.filter(a => a !== 'qaff');
    }
  }
  if (allowed.includes('crm')) {
    // Named-ID, BUKAN role-based: cuma 3 orang ini persis yang boleh buka
    // CRM, walau nanti ada spv baru ditambahkan lewat Manajemen Staff.
    const CRM_ALLOWED_IDS = ['owner', 'rizky', 'fahmi'];
    if (!CRM_ALLOWED_IDS.includes(userId)) {
      allowed = allowed.filter(a => a !== 'crm');
    }
  }
  if (allowed.includes('wabot')) {
    // Sama seperti CRM: named-ID, karena bisa edit persona bot, ambil-alih
    // percakapan customer, dan reset password staff sales affiliate.
    const WABOT_ALLOWED_IDS = ['owner', 'rizky', 'fahmi'];
    if (!WABOT_ALLOWED_IDS.includes(userId)) {
      allowed = allowed.filter(a => a !== 'wabot');
    }
  }
  // BARU (2026-08-03): "Pengaturan" (dulu sub-tab di dalam QTask) sekarang
  // jadi menu tersendiri di sidebar, KHUSUS Owner -- berisi Manajemen Staff
  // & Broadcast WA Staff, yang sifatnya administratif seluruh perusahaan,
  // bukan sesuatu yang perlu diakses staff biasa. Selalu ditambahkan di sini
  // (bukan lewat parsing rules di atas) supaya TIDAK BISA ke-grant lewat
  // kolom QcoSystem staff biasa -- murni berdasarkan role.
  if (emp.role === 'owner' && !allowed.includes('settings')) {
    allowed.push('settings');
  }
  // BARU (2026-08-17): "Content Plan" -- analisis Instagram/TikTok/FB/FB
  // Marketplace insight, KHUSUS 4 orang ini persis (named-ID, BUKAN
  // role-based, SAMA seperti pola CRM/WA Bot di atas): Owner, Admin Qco,
  // Rizky, Nanda. "Admin" di sini ditafsirkan sebagai Admin Qco (id 'Qco')
  // -- satu-satunya "Admin" yang pernah disebut sepanjang sesi ini,
  // BUKAN sebuah role (role 'admin' tidak ada di sistem ini) -- kalau
  // salah, cukup ubah CONTENT_PLAN_ALLOWED_IDS di atas (dekat definisi APPS).
  if (CONTENT_PLAN_ALLOWED_IDS.includes(userId) && !allowed.includes('content')) {
    allowed.push('content');
  }
  return allowed;
}
function isAppAllowed(userId, appId){
  return getAllowedApps(userId).includes(appId);
}
function getSalesNames(){
  // Hanya staff yang punya akses QSales di qcoSystem-nya
  const emps = getEmployees();
  return emps.filter(e => {
    const rules = String(e.qcoSystem || e.QcoSystem || '').toLowerCase();
    return rules.includes('sales') || rules.includes('qsales');
  }).map(e => e.name);
}
